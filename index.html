  // ---------- delegated actions ----------
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action==="open-benevole"){ benevoleFormOpen = true; benevoleError=""; renderBenevoles(); }
    else if(action==="cancel-benevole"){ benevoleFormOpen = false; renderBenevoles(); }
    else if(action==="open-candidature"){ candidatureFormOpen = true; candidatureError=""; candidatureEnvoyee=false; renderMissions(); }
    else if(action==="cancel-candidature"){ candidatureFormOpen = false; renderMissions(); }
    else if(action==="open-mission"){ missionFormOpen = true; renderMissions(); }
    else if(action==="cancel-mission"){ missionFormOpen = false; renderMissions(); }
    else if(action==="open-login"){ loginFormOpen = true; loginError=""; loginInfo=""; renderAdminRow(); }
    else if(action==="cancel-login"){ loginFormOpen = false; loginError=""; loginInfo=""; renderAdminRow(); }
    else if(action==="open-gestionnaire"){ gestionnaireFormOpen = true; gestionnaireError=""; renderEquipe(); }
    else if(action==="cancel-gestionnaire"){ gestionnaireFormOpen = false; renderEquipe(); }
    else if(action==="logout"){
      detachRoleCollections();
      detachPublicCollections();
      signOut(auth).then(function(){ return signInAnonymously(auth); }).catch(reportError);
    }
    else if(action==="mdp-oublie"){
      var form = document.getElementById("form-login");
      var email = form && form.email.value.trim();
      if(!email){ loginError = "Indique ton email d'abord."; renderAdminRow(); return; }
      sendPasswordResetEmail(auth, email).then(function(){
        loginError = ""; loginInfo = "Email envoyé si ce compte existe.";
        renderAdminRow();
      }).catch(function(){
        loginInfo = "Email envoyé si ce compte existe.";
        renderAdminRow();
      });
    }
    else if(action==="toggle-actif"){
      var b = benevoleById(el.getAttribute("data-id"));
      if(b){ updateDoc(doc(db,"benevoles",b.id), {actif: !b.actif}).catch(reportError); }
    }
    else if(action==="delete-benevole"){
      var bd = benevoleById(el.getAttribute("data-id"));
      if(!confirm("Supprimer définitivement " + (bd ? (bd.prenom+" "+bd.nom) : "ce bénévole") + " ? Cette action est irréversible.")) return;
      deleteDoc(doc(db,"benevoles", el.getAttribute("data-id"))).then(function(){
        logHistorique("suppression_benevole", bd ? (bd.prenom+" "+bd.nom) : "");
      }).catch(reportError);
    }
    else if(action==="valider-candidature"){
      var cId = el.getAttribute("data-id");
      var cand = state.candidatures.find(function(x){ return x.id === cId; });
      if(!cand) return;
      // Email/téléphone ne sont pas demandés dans le formulaire de
      // candidature (déjà connus via le dossier d'adhésion) : on les
      // demande ici, au moment de créer la fiche bénévole. L'email sert
      // d'identifiant unique de la fiche, il est donc obligatoire.
      var emailValide = prompt("Email de " + cand.prenom + " " + cand.nom + " (d'après son dossier d'adhésion) :");
      if(emailValide == null) return;
      emailValide = emailValide.trim();
      if(!emailValide){ alert("Email obligatoire pour créer la fiche bénévole."); return; }
      var telValide = prompt("Téléphone (facultatif, laisser vide si inconnu) :") || "";
      setDoc(doc(db,"benevoles", emailValide.toLowerCase()), {
        prenom: cand.prenom, nom: cand.nom, email: emailValide, tel: telValide.trim(), poles: cand.poles || [], actif: true,
        dateCreation: serverTimestamp()
      }).then(function(){
        return deleteDoc(doc(db,"candidatures", cId));
      }).then(function(){
        logHistorique("validation_candidature", cand.prenom + " " + cand.nom);
      }).catch(reportError);
    }
    else if(action==="refuser-candidature"){
      var cId2 = el.getAttribute("data-id");
      var cand2 = state.candidatures.find(function(x){ return x.id === cId2; });
      if(!confirm("Refuser et supprimer la candidature de " + (cand2 ? cand2.prenom+" "+cand2.nom : "cette personne") + " ? Cette action est irréversible.")) return;
      deleteDoc(doc(db,"candidatures", cId2)).then(function(){
        logHistorique("refus_candidature", cand2 ? (cand2.prenom + " " + cand2.nom) : "");
      }).catch(reportError);
    }
    else if(action==="inscrire"){
      var missionId = el.getAttribute("data-mission");
      var sel = document.getElementById("sel-"+missionId);
      if(sel && sel.value){
        addDoc(collection(db,"affectations"), {missionId:missionId, benevoleId:sel.value, statut:"inscrit"}).catch(reportError);
      }
    }
    else if(action==="inscrire-moi"){
      var missionIdMoi = el.getAttribute("data-mission");
      if(moiBenevoleId){
        var moiPourLog = benevoleById(moiBenevoleId);
        var missionPourLog = missionById(missionIdMoi);
        addDoc(collection(db,"affectations"), {missionId:missionIdMoi, benevoleId:moiBenevoleId, statut:"inscrit"}).then(function(){
          logHistoriquePublic(
            "inscription_publique",
            missionPourLog ? missionPourLog.titre : missionIdMoi,
            moiPourLog ? (moiPourLog.prenom+" "+moiPourLog.nom) : ""
          );
        }).catch(reportError);
      }
    }
    else if(action==="changer-identite"){
      moiBenevoleId = null;
      sauvegarderMoiBenevoleId(null);
      renderMissions();
    }
    else if(action==="retirer"){
      var aff = state.affectations.find(function(x){ return x.id === el.getAttribute("data-id"); });
      var mm = aff ? missionById(aff.missionId) : null;
      var bb = aff ? benevoleById(aff.benevoleId) : null;
      if(!confirm("Retirer l'inscription de " + (bb?(bb.prenom+" "+bb.nom):"ce bénévole") + (mm?(" à la mission « "+mm.titre+" »"):"") + " ?")) return;
      deleteDoc(doc(db,"affectations", el.getAttribute("data-id"))).then(function(){
        logHistorique("suppression_inscription", (bb?bb.prenom+" "+bb.nom:"") + (mm?" — "+mm.titre:""));
      }).catch(reportError);
    }
    else if(action==="delete-mission"){
      var mDel = missionById(el.getAttribute("data-id"));
      if(!confirm("Supprimer définitivement la mission « " + (mDel?mDel.titre:"") + " » ? Cette action est irréversible.")) return;
      deleteDoc(doc(db,"missions", el.getAttribute("data-id"))).then(function(){
        logHistorique("suppression_mission", mDel ? mDel.titre : "");
      }).catch(reportError);
    }
    else if(action==="export-json"){
      // Corrigé : il y avait deux blocs "export-json" identiques (un mort,
      // jamais exécuté) — celui qui s'exécutait réellement oubliait les
      // pôles. Un seul bloc désormais, qui inclut bien la liste des pôles.
      var exportData = {
        exporteLe: new Date().toISOString(),
        poles: state.poles,
        benevoles: state.benevoles,
        missions: state.missions,
        affectations: state.affectations,
        gestionnaires: state.gestionnaires.map(function(g){ return {nom:g.nom, role:g.role, actif:g.actif}; }),
        historique: state.historique
      };
      var jsonStr = JSON.stringify(exportData, null, 2);
      var blob = new Blob([jsonStr], {type: "application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      var dateStr = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = "benevoles-rancy-export-" + dateStr + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    else if(action==="toggle-gestionnaire"){
      var g = state.gestionnaires.find(function(x){ return x.id === el.getAttribute("data-id"); });
      if(g){
        updateDoc(doc(db,"gestionnaires", g.id), {actif: !g.actif}).then(function(){
          logHistorique(g.actif ? "desactivation_gestionnaire" : "reactivation_gestionnaire", g.nom);
        }).catch(reportError);
      }
    }
    else if(action==="delete-pole"){
      var poleNom = el.getAttribute("data-pole");
      if(!confirm("Retirer le pôle « "+poleNom+" » de la liste proposée ? Les bénévoles/missions qui l'ont déjà ne seront pas modifiés.")) return;
      var nouvelleListe = state.poles.filter(function(p){ return p !== poleNom; });
      setDoc(doc(db,"parametres","poles"), {liste: nouvelleListe}, {merge:true}).catch(reportError);
    }
    else if(action==="import-json"){
      var fileInput = document.getElementById("import-file-input");
      if(fileInput) fileInput.click();
    }
    else if(action==="trier-heures"){
      heuresTri = el.getAttribute("data-tri");
      renderHeures();
    }
    else if(action==="trier-historique"){
      historiqueTri = el.getAttribute("data-tri");
      renderHistorique();
    }
    else if(action==="basculer-vue-missions"){
      missionsVue = missionsVue === "tableau" ? "cartes" : "tableau";
      renderMissions();
    }
    else if(action==="trier-missions"){
      missionsTri = el.getAttribute("data-tri");
      renderMissions();
    }
    else if(action==="toggle-ligne-mission"){
      var mId = el.getAttribute("data-id");
      missionsDepliees[mId] = !missionsDepliees[mId];
      renderMissions();
    }
    else if(action==="basculer-vue-benevoles"){
      benevolesVue = benevolesVue === "tableau" ? "cartes" : "tableau";
      renderBenevoles();
    }
    else if(action==="trier-benevoles"){
      benevolesTri = el.getAttribute("data-tri");
      renderBenevoles();
    }
    else if(action==="toggle-ligne-benevole"){
      var bId = el.getAttribute("data-id");
      benevolesDepliees[bId] = !benevolesDepliees[bId];
      renderBenevoles();
    }
    else if(action==="imprimer-selection-benevoles"){
      imprimerSelectionBenevoles();
    }
    else if(action==="imprimer-selection-missions"){
      imprimerSelectionMissions();
    }
    else if(action==="imprimer-selection-heures"){
      imprimerSelectionHeures();
    }
    else if(action==="imprimer-selection-historique"){
      imprimerSelectionHistorique();
    }
    else if(action==="vider-selection-benevoles"){
      benevolesSelection = {};
      renderBenevoles();
    }
    else if(action==="vider-selection-missions"){
      missionsSelection = {};
      renderMissions();
    }
    else if(action==="vider-selection-heures"){
      heuresSelection = {};
      renderHeures();
    }
    else if(action==="vider-selection-historique"){
      historiqueSelection = {};
      renderHistorique();
    }
  });

  // Recherche générale dans le tableau "Heures données", dans le module
  // Bénévoles, dans l'Historique et dans la vue tableau des Missions :
  // filtre en direct sans perdre le focus ni la position du curseur dans
  // le champ.
  document.addEventListener("input", function(e){
    if(e.target.id === "heures-recherche"){
      heuresRecherche = e.target.value;
      var pos = e.target.selectionStart;
      renderHeures();
      var champ = document.getElementById("heures-recherche");
      if(champ){ champ.focus(); champ.setSelectionRange(pos,pos); }
    }
    else if(e.target.id === "benevoles-recherche"){
      benevolesRecherche = e.target.value;
      var pos2 = e.target.selectionStart;
      renderBenevoles();
      var champ2 = document.getElementById("benevoles-recherche");
      if(champ2){ champ2.focus(); champ2.setSelectionRange(pos2,pos2); }
    }
    else if(e.target.id === "historique-recherche"){
      historiqueRecherche = e.target.value;
      var pos3 = e.target.selectionStart;
      renderHistorique();
      var champ3 = document.getElementById("historique-recherche");
      if(champ3){ champ3.focus(); champ3.setSelectionRange(pos3,pos3); }
    }
    else if(e.target.id === "missions-recherche"){
      missionsRecherche = e.target.value;
      var pos4 = e.target.selectionStart;
      renderMissions();
      var champ4 = document.getElementById("missions-recherche");
      if(champ4){ champ4.focus(); champ4.setSelectionRange(pos4,pos4); }
    }
  });

  // Listes déroulantes "Filtrer par pôle" (Bénévoles, Missions et Heures
  // données), basées sur la liste des pôles de Paramètres.
  document.addEventListener("change", function(e){
    if(e.target.id === "benevoles-filtre-pole"){
      benevolesFiltrePole = e.target.value;
      renderBenevoles();
    }
    else if(e.target.id === "missions-filtre-pole"){
      missionsFiltrePole = e.target.value;
      renderMissions();
    }
    else if(e.target.id === "heures-filtre-pole"){
      heuresFiltrePole = e.target.value;
      renderHeures();
    }
  });

  // Cases à cocher pour l'impression de la sélection (Bénévoles / Missions),
  // y compris la case "tout cocher" en en-tête de colonne, qui n'agit que
  // sur les lignes actuellement affichées (recherche/filtre en cours).
  document.addEventListener("change", function(e){
    if(e.target.matches('[data-action="toggle-select-benevole"]')){
      benevolesSelection[e.target.getAttribute("data-id")] = e.target.checked;
      renderBenevoles();
    }
    else if(e.target.matches('[data-action="toggle-select-all-benevoles"]')){
      var checkedB = e.target.checked;
      document.querySelectorAll('#panel-benevoles [data-action="toggle-select-benevole"]').forEach(function(cb){
        benevolesSelection[cb.getAttribute("data-id")] = checkedB;
      });
      renderBenevoles();
    }
    else if(e.target.matches('[data-action="toggle-select-mission"]')){
      missionsSelection[e.target.getAttribute("data-id")] = e.target.checked;
      renderMissions();
    }
    else if(e.target.matches('[data-action="toggle-select-all-missions"]')){
      var checkedM = e.target.checked;
      document.querySelectorAll('#panel-missions [data-action="toggle-select-mission"]').forEach(function(cb){
        missionsSelection[cb.getAttribute("data-id")] = checkedM;
      });
      renderMissions();
    }
    else if(e.target.matches('[data-action="toggle-select-heure"]')){
      heuresSelection[e.target.getAttribute("data-id")] = e.target.checked;
      renderHeures();
    }
    else if(e.target.matches('[data-action="toggle-select-all-heures"]')){
      var checkedHe = e.target.checked;
      document.querySelectorAll('#panel-heures [data-action="toggle-select-heure"]').forEach(function(cb){
        heuresSelection[cb.getAttribute("data-id")] = checkedHe;
      });
      renderHeures();
    }
    else if(e.target.matches('[data-action="toggle-select-historique"]')){
      historiqueSelection[e.target.getAttribute("data-id")] = e.target.checked;
      renderHistorique();
    }
    else if(e.target.matches('[data-action="toggle-select-all-historique"]')){
      var checkedHi = e.target.checked;
      document.querySelectorAll('#panel-historique [data-action="toggle-select-historique"]').forEach(function(cb){
        historiqueSelection[cb.getAttribute("data-id")] = checkedHi;
      });
      renderHistorique();
    }
  });

  document.addEventListener("change", function(e){
    if(e.target.matches('[data-action="toggle-realise"]')){
      var id = e.target.getAttribute("data-id");
      var aff = state.affectations.find(function(x){ return x.id === id; });
      var mm = aff ? missionById(aff.missionId) : null;
      var bb = aff ? benevoleById(aff.benevoleId) : null;
      var checked = e.target.checked;
      updateDoc(doc(db,"affectations",id), {statut: checked ? "realise" : "inscrit"}).then(function(){
        logHistorique(checked ? "validation" : "annulation_validation", (bb?bb.prenom+" "+bb.nom:"") + (mm?" — "+mm.titre:""));
      }).catch(reportError);
    }
    if(e.target.id === "import-file-input"){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        var data;
        try{
          data = JSON.parse(reader.result);
        }catch(err){
          importStatus = "Fichier invalide : ce n'est pas un export JSON valide.";
          importError = true;
          renderDonnees();
          return;
        }
        var nbB = (data.benevoles||[]).length, nbM = (data.missions||[]).length, nbA = (data.affectations||[]).length;
        if(!confirm("Importer ce fichier ? " + nbB + " bénévole(s), " + nbM + " mission(s) et " + nbA + " inscription(s) du fichier remplaceront ceux qui portent le même identifiant en ligne. Rien d'autre ne sera supprimé.")){
          e.target.value = "";
          return;
        }
        importerDonnees(data);
        e.target.value = "";
      };
      reader.readAsText(file);
    }
  });

  document.addEventListener("submit", function(e){
    if(e.target.id === "form-login"){
      e.preventDefault();
      var fl = e.target;
      signInWithEmailAndPassword(auth, fl.email.value.trim(), fl.code.value).then(function(){
        loginFormOpen = false; loginError = ""; loginInfo = "";
      }).catch(function(){
        loginError = "Email ou code incorrect.";
        renderAdminRow();
      });
      return;
    }
    if(e.target.id === "form-gestionnaire"){
      e.preventDefault();
      var fg = e.target;
      var nom = fg.nom.value.trim();
      var email = fg.email.value.trim();
      var code = fg.code.value;
      createUserWithEmailAndPassword(secondaryAuth, email, code).then(function(cred){
        var newUid = cred.user.uid;
        return setDoc(doc(db,"gestionnaires", newUid), {
          nom: nom, actif: true, role: "gestionnaire", creeLe: serverTimestamp()
        }).then(function(){
          return signOut(secondaryAuth);
        }).then(function(){
          logHistorique("ajout_gestionnaire", nom);
          gestionnaireFormOpen = false; gestionnaireError = "";
          renderEquipe();
        });
      }).catch(function(err){
        gestionnaireError = err && err.code === "auth/email-already-in-use"
          ? "Cet email est déjà utilisé par un compte."
          : (err && err.code === "auth/weak-password" ? "Code trop court (6 caractères minimum)." : "Erreur : " + (err && err.message ? err.message : err));
        renderEquipe();
      });
      return;
    }
    if(e.target.id === "form-identite"){
      e.preventDefault();
      var fi = e.target;
      var pSaisi = fi.prenom.value.trim().toLowerCase();
      var nSaisi = fi.nom.value.trim().toLowerCase();
      var eSaisi = fi.email.value.trim().toLowerCase();
      // Prénom + nom + email doivent correspondre exactement à une fiche
      // bénévole déjà validée et active : ça remplace l'ancienne liste
      // déroulante ouverte, qui permettait de s'inscrire sous le nom de
      // n'importe qui. L'email n'étant plus affiché nulle part publiquement,
      // seul le bénévole concerné (ou quelqu'un à qui il l'a donné) le connaît.
      var correspond = state.benevoles.find(function(b){
        return b.actif
          && (b.prenom||"").trim().toLowerCase() === pSaisi
          && (b.nom||"").trim().toLowerCase() === nSaisi
          && (b.email||"").trim().toLowerCase() === eSaisi;
      });
      if(correspond){
        moiBenevoleId = correspond.id;
        sauvegarderMoiBenevoleId(moiBenevoleId);
        identiteError = "";
        renderMissions();
      } else {
        identiteError = "Aucune fiche bénévole ne correspond à ces informations. Vérifiez l'orthographe et l'email utilisé lors de la candidature.";
        renderMissions();
      }
      return;
    }
    if(e.target.id === "form-candidature"){
      e.preventDefault();
      var fc = e.target;
      var polesC = Array.prototype.slice.call(fc.querySelectorAll('input[name="pole"]:checked')).map(function(i){ return i.value; });
      var candPrenom = fc.prenom.value.trim();
      var candNom = fc.nom.value.trim();
      addDoc(collection(db,"candidatures"), {
        prenom: candPrenom, nom: candNom, poles: polesC, dateEnvoi: serverTimestamp()
      }).then(function(){
        candidatureFormOpen = false; candidatureError = ""; candidatureEnvoyee = true;
        renderMissions();
        // Ouvre le client mail du visiteur pour prévenir l'association, si une
        // adresse a été configurée dans Paramètres (lien mailto : aucune
        // infrastructure d'envoi d'email nécessaire). Pas d'email/téléphone
        // du candidat dans ce message : il n'est pas demandé dans le
        // formulaire (déjà connu via le dossier d'adhésion).
        if(state.emailCandidature){
          var sujet = "Nouvelle candidature bénévole — " + candPrenom + " " + candNom;
          var corps = "Nouvelle candidature reçue sur le site des bénévoles :\n\n"
            + "Prénom : " + candPrenom + "\nNom : " + candNom
            + "\nPôles souhaités : " + (polesC.join(", ") || "aucun")
            + "\n\nÀ valider dans l'onglet Candidatures du site (ses coordonnées vous seront demandées à la validation).";
          window.location.href = "mailto:" + encodeURIComponent(state.emailCandidature) + "?subject=" + encodeURIComponent(sujet) + "&body=" + encodeURIComponent(corps);
        }
      }).catch(function(err){
        candidatureError = "Erreur, réessayez.";
        renderMissions();
      });
      return;
    }
    if(e.target.id === "form-benevole"){
      e.preventDefault();
      var f = e.target;
      var emailId = f.email.value.trim().toLowerCase();
      var poles = Array.prototype.slice.call(f.querySelectorAll('input[name="pole"]:checked')).map(function(i){ return i.value; });
      var benPrenom = f.prenom.value.trim();
      var benNom = f.nom.value.trim();
      setDoc(doc(db,"benevoles", emailId), {
        prenom: benPrenom,
        nom: benNom,
        email: f.email.value.trim(),
        tel: f.tel.value.trim(),
        poles: poles,
        actif: true,
        dateCreation: serverTimestamp()
      }).then(function(){
        benevoleFormOpen = false; benevoleError=""; renderBenevoles();
        logHistorique("creation_benevole", benPrenom + " " + benNom);
      }).catch(function(err){
        benevoleError = (err && err.code === "permission-denied")
          ? "Cette adresse email est déjà enregistrée."
          : "Erreur, réessayez.";
        renderBenevoles();
      });
    }
    if(e.target.id === "form-mission"){
      e.preventDefault();
      var f2 = e.target;
      var titre = f2.titre.value.trim();
      addDoc(collection(db,"missions"), {
        titre: titre,
        pole: f2.pole.value,
        date: f2.date.value,
        lieu: f2.lieu.value.trim(),
        debut: f2.debut.value,
        fin: f2.fin.value,
        placesTotal: Math.max(1, parseInt(f2.placesTotal.value,10) || 1),
        description: f2.description.value.trim(),
        creePar: moiNom,
        creeLe: serverTimestamp()
      }).then(function(){
        logHistorique("creation_mission", titre);
        missionFormOpen = false; renderMissions();
      }).catch(reportError);
    }
    if(e.target.id === "form-pole"){
      e.preventDefault();
      var fp = e.target;
      var nomPole = fp.nom.value.trim();
      if(!nomPole) return;
      var nouvelleListePoles = state.poles.concat([nomPole]).filter(function(v,i,arr){ return arr.indexOf(v) === i; });
      setDoc(doc(db,"parametres","poles"), {liste: nouvelleListePoles}, {merge:true}).then(function(){
        fp.reset();
      }).catch(reportError);
    }
    if(e.target.id === "form-email-candidature"){
      e.preventDefault();
      var fec = e.target;
      var emailC = fec.emailCandidature.value.trim();
      setDoc(doc(db,"parametres","poles"), {emailCandidature: emailC}, {merge:true}).then(function(){
        logHistorique("modification_email_candidature", emailC);
      }).catch(reportError);
    }
  });

  function importerDonnees(data){
    var promesses = [];
    var nbPolesAjoutes = 0;
    // Restaure les pôles du fichier exporté : ajoutés à la liste actuelle
    // sans rien retirer (même logique que pour bénévoles/missions/inscriptions
    // ci-dessous — un import ne supprime jamais ce qui existe déjà en ligne).
    if(Array.isArray(data.poles) && data.poles.length){
      var polesFusionnes = state.poles.concat(data.poles).filter(function(p, i, arr){
        return p && arr.indexOf(p) === i;
      });
      nbPolesAjoutes = polesFusionnes.length - state.poles.length;
      if(nbPolesAjoutes > 0){
        promesses.push(setDoc(doc(db,"parametres","poles"), {liste: polesFusionnes}, {merge:true}));
      }
    }
    (data.benevoles||[]).forEach(function(b){
      if(!b || !b.id) return;
      var copie = Object.assign({}, b);
      delete copie.id;
      promesses.push(setDoc(doc(db,"benevoles", b.id), copie));
    });
    (data.missions||[]).forEach(function(m){
      if(!m || !m.id) return;
      var copie = Object.assign({}, m);
      delete copie.id;
      promesses.push(setDoc(doc(db,"missions", m.id), copie));
    });
    (data.affectations||[]).forEach(function(a){
      if(!a || !a.id) return;
      var copie = Object.assign({}, a);
      delete copie.id;
      promesses.push(setDoc(doc(db,"affectations", a.id), copie));
    });
    Promise.all(promesses).then(function(){
      importStatus = "Import terminé : " + (data.benevoles||[]).length + " bénévole(s), " + (data.missions||[]).length + " mission(s), " + (data.affectations||[]).length + " inscription(s)"
        + (nbPolesAjoutes > 0 ? ", " + nbPolesAjoutes + " pôle(s) ajouté(s)" : "") + " traité(s).";
      importError = false;
      logHistorique("import_donnees", importStatus);
      renderDonnees();
    }).catch(function(err){
      importStatus = "Erreur pendant l'import : " + (err && err.message ? err.message : err);
      importError = true;
      renderDonnees();
    });
  }

  function reportError(err){
    console.error(err);
    alert("Une erreur est survenue, réessayez dans un instant : " + (err && err.message ? err.message : err));
  }

  // ---------- collections réservées gestionnaires/Directeur ----------
  function attachRoleCollections(){
    if(unsubGestionnaires) return;
    unsubGestionnaires = onSnapshot(collection(db,"gestionnaires"), function(snap){
      state.gestionnaires = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
    unsubHistorique = onSnapshot(collection(db,"historique"), function(snap){
      state.historique = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
    unsubCandidatures = onSnapshot(collection(db,"candidatures"), function(snap){
      state.candidatures = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
  }

  function detachRoleCollections(){
    if(unsubGestionnaires){ unsubGestionnaires(); unsubGestionnaires = null; }
    if(unsubHistorique){ unsubHistorique(); unsubHistorique = null; }
    if(unsubCandidatures){ unsubCandidatures(); unsubCandidatures = null; }
    state.gestionnaires = [];
    state.historique = [];
    state.candidatures = [];
  }

  // ---------- Firebase wiring ----------
  onAuthStateChanged(auth, function(user){
    authReady = !!user;
    document.getElementById("status-dot").classList.toggle("ok", authReady);
    document.getElementById("status-text").textContent = authReady ? "Connecté — les données sont partagées en direct." : "Connexion à la base de données…";

    if(authReady){ attachPublicCollections(); }

    if(unsubMoi){ unsubMoi(); unsubMoi = null; }
    detachRoleCollections();
    role = "public"; moiNom = ""; moiUid = null;

    var isPasswordUser = !!(user && user.providerData.some(function(p){ return p.providerId === "password"; }));
    if(user && isPasswordUser){
      moiUid = user.uid;
      unsubMoi = onSnapshot(doc(db,"gestionnaires", user.uid), function(snap){
        if(snap.exists() && snap.data().actif){
          role = snap.data().role === "directeur" ? "directeur" : "gestionnaire";
          moiNom = snap.data().nom || "";
          attachRoleCollections();
        } else {
          role = "public"; moiNom = "";
          detachRoleCollections();
        }
        renderAll();
      }, function(){ role = "public"; moiNom = ""; renderAll(); });
    }

    renderAll();
  });

  signInAnonymously(auth).catch(function(err){
    document.getElementById("status-text").textContent = "Connexion impossible : " + (err && err.message ? err.message : err);
  });

  function sortBenevoles(){ state.benevoles.sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||"") || (a.prenom||"").localeCompare(b.prenom||""); }); }
  function sortMissions(){ state.missions.sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.debut||"").localeCompare(b.debut||""); }); }

  var publicCollectionsAttached = false;
  var unsubBenevoles = null, unsubMissions = null, unsubAffectations = null, unsubParametres = null;

  function attachPublicCollections(){
    // N'ouvrir ces écoutes qu'une fois la connexion (même anonyme) confirmée :
    // sinon, sur un réseau lent, Firestore refuse la lecture le temps que la
    // connexion s'établisse, et une alerte d'erreur apparaît inutilement.
    if(publicCollectionsAttached) return;
    publicCollectionsAttached = true;

    unsubBenevoles = onSnapshot(collection(db,"benevoles"), function(snap){
      state.benevoles = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      sortBenevoles();
      renderAll();
    }, reportError);

    unsubMissions = onSnapshot(collection(db,"missions"), function(snap){
      state.missions = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      sortMissions();
      renderAll();
    }, reportError);

    unsubAffectations = onSnapshot(collection(db,"affectations"), function(snap){
      state.affectations = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, reportError);

    unsubParametres = onSnapshot(doc(db,"parametres","poles"), function(snap){
      state.poles = (snap.exists() && Array.isArray(snap.data().liste) && snap.data().liste.length) ? snap.data().liste : POLES.slice();
      state.emailCandidature = (snap.exists() && snap.data().emailCandidature) ? snap.data().emailCandidature : "";
      renderAll();
    }, function(){ /* pas encore de liste personnalisée : on garde les valeurs par défaut */ });
  }

  function detachPublicCollections(){
    // À appeler juste avant une déconnexion : le court instant sans session
    // (entre la déconnexion et la reconnexion anonyme automatique) ferait
    // sinon échouer ces écoutes déjà ouvertes avec une alerte d'erreur.
    if(unsubBenevoles){ unsubBenevoles(); unsubBenevoles = null; }
    if(unsubMissions){ unsubMissions(); unsubMissions = null; }
    if(unsubAffectations){ unsubAffectations(); unsubAffectations = null; }
    if(unsubParametres){ unsubParametres(); unsubParametres = null; }
    publicCollectionsAttached = false;
  }

  renderAll();
</script>
