            + '</tr></thead><tbody>'+lignesHtml+'</tbody></table></div>'
          : '<div class="empty-state">'+(missionsAffichees.length ? 'Aucune mission ne correspond.' : 'Aucune mission proposée pour l\'instant.')+'</div>');
    }

    // La modale de création/modification de mission (formHtml) n'est plus
    // construite ici : elle est commune à tout le site (accessible aussi
    // depuis une fiche bénévole) et vit désormais dans renderModal(), tout
    // en bas de ce fichier, avec la modale "voir la mission".

    // La candidature ("Envoyer ma candidature") est affichée ici, en tête de
    // l'onglet Missions, plutôt que dans un onglet Bénévoles à part : le
    // visiteur voit d'abord les missions à pourvoir, ce qui donne envie de
    // s'inscrire, et peut candidater dans la foulée. Les autres fiches
    // bénévoles restent invisibles au public (voir renderBenevoles()).
    // Un visiteur déjà identifié (voir identiteHtml ci-dessous) est déjà un
    // bénévole inscrit : pas de sens à lui proposer d'envoyer une
    // candidature, donc tout le bloc candidature disparaît dans ce cas.
    var candidatureHtml = "";
    if(role === "public" && !moiBenevoleId){
      if(candidatureEnvoyee){
        candidatureHtml = '<div class="card" style="max-width:560px;margin-bottom:14px;">'
          + '<div class="msg-ok">Candidature envoyée, en attente de validation par la Direction sous 48 h maximum.</div></div>';
      } else if(candidatureFormOpen){
        // Le candidat donne lui-même son email et son téléphone : le/la
        // gestionnaire n'a ainsi rien à ressaisir à la validation (voir
        // action "valider-candidature") — auparavant ces coordonnées
        // n'étaient demandées qu'au gestionnaire, via deux pop-up, au moment
        // de valider.
        candidatureHtml = '<form class="form" id="form-candidature" style="margin-bottom:14px;">'
          + '<div class="field-row">'
          + missionChampHtml("Prénom","prenom",true)
          + missionChampHtml("Nom","nom",true)
          + missionChampHtml("Email","email",true,"email")
          + missionChampHtml("Téléphone","tel",false,"tel")
          + '</div>'
          + '<div class="field"><label>Pôles / domaines</label><div class="checkbox-group">'
          + state.poles.map(function(p){ return '<label class="checkbox-chip"><input type="checkbox" name="pole" value="'+escapeHtml(p)+'"> '+escapeHtml(p)+'</label>'; }).join("")
          + '</div></div>'
          + '<div class="form-actions"><button type="submit" class="btn btn-primary" '+(authReady?"":"disabled")+'>Envoyer ma candidature</button>'
          + '<button type="button" class="btn btn-ghost" data-action="cancel-candidature">Annuler</button>'
          + (authReady ? '' : '<span class="form-hint">Connexion en cours…</span>')
          + (candidatureError ? '<span class="error-text">'+escapeHtml(candidatureError)+'</span>' : '')
          + '</div>'
          + '</form>';
      } else {
        candidatureHtml = '<div class="card" style="max-width:560px;margin-bottom:14px;">'
          + '<div style="margin-bottom:8px;">Envie de rejoindre les bénévoles des Rancy ?</div>'
          + '<button class="btn btn-primary" data-action="open-candidature">+ Envoyer ma candidature</button>'
          + '</div>';
      }
    }

    var identiteHtml = "";
    if(role === "public"){
      var moiIdentite = moiBenevoleId ? benevoleById(moiBenevoleId) : null;
      if(moiIdentite){
        identiteHtml = '<div class="card" style="margin-bottom:14px;"><div>Vous êtes identifié(e) comme <strong>'+escapeHtml(moiIdentite.prenom)+' '+escapeHtml(moiIdentite.nom)+'</strong>. '
          + '<button class="link-btn" data-action="changer-identite">Ce n\'est pas vous ?</button>'
          + ' <button class="link-btn" data-action="open-mon-historique">Voir mon historique</button></div></div>';
      } else if(identiteFormOpen){
        // Avant : une liste déroulante de tous les bénévoles actifs — donc
        // n'importe qui pouvait s'inscrire sous le nom de n'importe qui.
        // Désormais il faut saisir prénom + nom + email correspondant
        // exactement à une fiche bénévole déjà validée. L'email n'étant plus
        // affiché nulle part publiquement (voir onglet Bénévoles), ce n'est
        // plus une information à la portée de n'importe quel visiteur.
        identiteHtml = '<div class="card" style="margin-bottom:14px;">'
          + '<div style="margin-bottom:8px;">Identifiez-vous (les informations doivent correspondre à votre fiche bénévole validée) :</div>'
          + '<form class="form" id="form-identite"><div class="field-row">'
          + missionChampHtml("Prénom","prenom",true)
          + missionChampHtml("Nom","nom",true)
          + missionChampHtml("Email","email",true,"email")
          + '</div><div class="form-actions"><button type="submit" class="btn btn-sm btn-primary">Valider</button>'
          + '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-identite">Annuler</button>'
          + (identiteError ? '<span class="error-text">'+escapeHtml(identiteError)+'</span>' : '')
          + '</div></form>';
      } else {
        // Replié par défaut : juste un bandeau, pour ne pas imposer le
        // formulaire à quelqu'un qui n'est encore qu'en train de regarder
        // les missions proposées (gain de place, surtout sur téléphone).
        identiteHtml = '<div class="card" style="margin-bottom:14px;">'
          + '<div style="margin-bottom:8px;">Identifiez-vous pour pouvoir vous inscrire à une mission.</div>'
          + '<button class="btn btn-sm" data-action="open-identite">Je m\'identifie</button>'
          + '</div>';
      }
    }

    var vueToggleBtn = role !== "public"
      ? '<button class="btn btn-badge badge-vue btn-sm" data-action="basculer-vue-missions">'+(missionsVue==="tableau" ? "Vue cartes" : "Vue tableau")+'</button>'
      : '';

    // Boutons Imprimer/Vider : toujours affichés, juste désactivés tant
    // qu'il n'y a rien à imprimer ou à vider (rien coché, ou vue cartes où
    // il n'y a pas de case à cocher) — même logique que pour Bénévoles, pour
    // que la barre d'outils ne saute plus. Compte toutes les missions
    // cochées même si un filtre les cache momentanément.
    var nbSelectionnesM = state.missions.filter(function(m){ return missionsSelection[m.id]; }).length;
    var selectionActiveM = missionsVue === "tableau" && nbSelectionnesM > 0;
    var imprimerBtnM = role !== "public"
      ? '<button class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-selection-missions"'+(selectionActiveM?"":" disabled")+'>Imprimer la sélection ('+nbSelectionnesM+')</button>'
        + '<button class="btn btn-badge badge-vider btn-sm" data-action="vider-selection-missions"'+(selectionActiveM?"":" disabled")+'>Vider la sélection</button>'
      : '';

    document.getElementById("panel-missions").innerHTML =
      '<div class="toolbar"><h2>Missions</h2>'
      + '<div style="display:flex;gap:8px;">'+imprimerBtnM+vueToggleBtn
      + (role !== "public" ? '<button class="btn btn-primary" data-action="open-mission">+ Créer une mission</button>' : '')
      + '</div></div>'
      + candidatureHtml
      + identiteHtml
      + (role !== "public" && missionsVue === "tableau"
          ? tableauHtml
          : (missionsAffichees.length ? '<div class="card-grid">'+cards+'</div>' : '<div class="empty-state">Aucune mission proposée pour l\'instant.</div>'));
  }

  // Champs de formulaire réutilisés par la modale de création/modification
  // de mission (missionFormModalHtml, voir plus bas, section modales).
  // `couleur`, optionnel, est un objet {fc, fcSoft} (voir couleurNommee /
  // couleurPole ci-dessous) qui colore le libellé et le cadre du champ —
  // inspiré des fiches colorées de PICS.
  function missionChampHtml(label, name, required, type, value, couleur){
    var classeCol = couleur ? ' champ-colore' : '';
    var styleCol = couleur ? ' style="--fc:'+couleur.fc+';--fc-soft:'+couleur.fcSoft+';"' : '';
    return '<div class="field'+classeCol+'"'+styleCol+'><label for="f-'+name+'">'+label+'</label>'
      + '<input id="f-'+name+'" name="'+name+'" type="'+(type||"text")+'" '+(type==="number"?'min="1"':'')+' '+(required ? "required" : "")
      + (value!=null && value!=="" ? ' value="'+escapeHtml(String(value))+'"' : '') + '></div>';
  }
  function missionSelectChampHtml(label,name,options,selected,couleur){
    var classeCol = couleur ? ' champ-colore' : '';
    var styleCol = couleur ? ' style="--fc:'+couleur.fc+';--fc-soft:'+couleur.fcSoft+';"' : '';
    return '<div class="field'+classeCol+'"'+styleCol+'><label for="f-'+name+'">'+label+'</label><select id="f-'+name+'" name="'+name+'">'
      + options.map(function(o){ return '<option value="'+escapeHtml(o)+'"'+(selected===o?' selected':'')+'>'+escapeHtml(o)+'</option>'; }).join("")
      + '</select></div>';
  }
  // Couleur fixe (accent/warm/success/danger, mêmes teintes que le reste du
  // site) ou couleur dynamique liée au pôle (même teinte que son badge,
  // voir poleTag/hueForPole) — deux petites usines à {fc, fcSoft}.
  function couleurNommee(nom){
    return { fc: 'var(--'+nom+')', fcSoft: 'var(--'+nom+'-soft)' };
  }
  function couleurPole(pole){
    var h = hueForPole(pole || "");
    return { fc: 'hsl('+h+',45%,32%)', fcSoft: 'hsl('+h+',60%,94%)' };
  }

  // ---------- modale "mission" (créer / voir / modifier) ----------
  // Une seule et même modale, commune à tout le site : accessible aussi
  // bien depuis l'onglet Missions (clic sur une ligne du tableau, ou
  // "+ Créer une mission") que depuis le badge "Voir la mission" d'une
  // fiche bénévole — dans tous les cas elle s'ouvre directement modifiable,
  // sans détour par une modale "juste voir" (demande de Jluc). Elle
  // s'affiche par-dessus l'écran actuel sans jamais changer d'onglet ; la
  // fermer (✕, Annuler, clic sur le fond ou Échap) fait réapparaître
  // l'onglet en dessous (Bénévoles, Missions, peu importe : on n'a jamais
  // bougé). Présentation inspirée des modales de gestion de PICS (demande
  // de Jluc) : bandeau de titre coloré, et champs identifiants (Titre,
  // Pôle, Statut, Commentaires) mis en couleur pour se repérer d'un coup
  // d'œil — le Pôle et le Statut reprennent exactement la même teinte que
  // leurs badges habituels (hueForPole / STATUT_COULEUR), pour rester
  // cohérent avec le reste du site plutôt que d'inventer une palette à
  // part. Quand on crée une mission (missionEnEdition vide), il n'y a bien
  // sûr encore ni badges ni inscrits à afficher.
  function missionFormModalHtml(){
    var missionEdit = missionEnEdition ? missionById(missionEnEdition) : null;

    var enteteHtml = "";
    if(missionEdit){
      var restantes = placesRestantes(missionEdit);
      var badgeCls = "places-badge" + (restantes <= 0 ? " low" : "");
      var badgeTxt = restantes <= 0 ? "Complet" : (restantes + " place" + (restantes>1?"s":"") + " restante" + (restantes>1?"s":""));
      enteteHtml = '<div class="mission-head" style="margin-bottom:10px;">'
        + '<div class="tags">'+poleTag(missionEdit.pole)+statutTag(statutMission(missionEdit))+'</div>'
        + '<span class="'+badgeCls+'">'+badgeTxt+'</span></div>';
    }

    var poleActuel = missionEdit ? missionEdit.pole : (state.poles[0]||"");
    var statutActuel = missionEdit ? statutMission(missionEdit) : state.statutsMissions[0];
    var couleurStatut = couleurNommee(STATUT_COULEUR[statutActuel] || "accent");

    var labelTitre = "Titre de la mission" + (missionEdit && missionEdit.numero ? ' <span class="mission-id-badge">M'+missionEdit.numero+'</span>' : '');

    var formMissionHtml = '<form class="form" id="form-mission">'
      + enteteHtml
      + missionChampHtml(labelTitre,"titre",true,"text",missionEdit?missionEdit.titre:"",couleurNommee("accent"))
      + '<div class="field-row">'
      + missionSelectChampHtml("Pôle","pole",state.poles,missionEdit?missionEdit.pole:"",couleurPole(poleActuel))
      + missionSelectChampHtml("Statut","statut",state.statutsMissions,statutActuel,couleurStatut)
      + '</div>'
      + '<div class="field-row">'
      + missionChampHtml("Date","date",true,"date",missionEdit?missionEdit.date:"")
      + missionChampHtml("Lieu","lieu",true,"text",missionEdit?missionEdit.lieu:"")
      + '</div>'
      + '<div class="field-row" style="grid-template-columns:repeat(4,1fr);">'
      + missionChampHtml("Heure de début","debut",true,"time",missionEdit?missionEdit.debut:"")
      + missionChampHtml("Heure de fin","fin",true,"time",missionEdit?missionEdit.fin:"")
      + '<div class="field"><label for="f-duree-affichage">Durée</label><input id="f-duree-affichage" type="text" readonly value="'+calculDureeAffichage(missionEdit?missionEdit.debut:"", missionEdit?missionEdit.fin:"")+'"></div>'
      + missionChampHtml("Places proposées","placesTotal",true,"number",missionEdit?missionEdit.placesTotal:"")
      + '</div>'
      + '<div class="field"><label for="f-description">Description</label><textarea id="f-description" name="description" rows="2">'+escapeHtml(missionEdit?missionEdit.description:"")+'</textarea></div>'
      // Commentaires : champ demandé par Jluc pour le suivi interne (jamais
      // montré au public, voir missionCardHtml) — distinct de la
      // Description, qui elle est publique.
      + '<div class="field champ-colore" style="--fc:var(--warm);--fc-soft:var(--warm-soft);">'
        + '<label for="f-commentaires">Commentaires <span class="form-hint">(usage interne, jamais visible du public)</span></label>'
        + '<textarea id="f-commentaires" name="commentaires" rows="2">'+escapeHtml(missionEdit?missionEdit.commentaires:"")+'</textarea></div>'
      + (missionFormError ? '<div class="error-text" style="margin-bottom:8px;">'+escapeHtml(missionFormError)+'</div>' : '')
      + '<div class="form-actions"><button type="submit" class="btn btn-primary" '+(authReady?"":"disabled")+'>💾 '+(missionEdit?"Enregistrer les modifications":"Créer la mission")+'</button>'
      + '<button type="button" class="btn btn-ghost" data-action="cancel-mission">Annuler</button>'
      + (missionEdit && role === "directeur" ? '<button type="button" class="btn-danger-ghost" data-action="delete-mission" data-id="'+missionEdit.id+'">Supprimer la mission</button>' : '')
      + (missionEdit ? '<button type="button" class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-fiche-mission" data-id="'+missionEdit.id+'">Imprimer la fiche</button>' : '')
      + (authReady ? '' : '<span class="form-hint">Connexion en cours…</span>')
      + '</div>'
      // Qui est déjà inscrit, et inscrire quelqu'un d'autre : seulement pour
      // une mission qui existe déjà (pas de sens à la création).
      + (missionEdit ? '<div class="modal-section-inscrits"><div class="modal-section-titre">👥 INSCRITS</div>'+missionInscritsSectionHtml(missionEdit)+'</div>' : '')
      + '</form>';
    return '<div class="modal-backdrop" data-action="close-modal-mission">'
      + '<div class="modal-box"><div class="modal-box-head"><h3>'+(missionEdit?"Modifier la mission":"Créer une mission")+'</h3>'
      + '<button type="button" class="modal-close" data-action="cancel-mission" aria-label="Fermer">✕</button></div>'
      + formMissionHtml + '</div></div>';
  }

  // Fiche bénévole en modale (voir/modifier) — même principe que
  // missionFormModalHtml() : bandeau coloré, champs modifiables, actions,
  // puis l'historique des inscriptions. Le badge "Voir la mission" à
  // l'intérieur ouvre la modale mission PAR-DESSUS celle-ci (renderModal
  // affiche les deux, la mission en dernier donc au-dessus) ; la fermer
  // revient simplement à la fiche bénévole, toujours ouverte en dessous.
  function benevoleModaleHtml(){
    var b = benevoleModaleId ? benevoleById(benevoleModaleId) : null;
    if(!b) return "";
    var heuresMap = heuresParBenevole();
    var h = Math.round((heuresMap[b.id]||0)*10)/10;

    var enteteHtml = '<div class="mission-head" style="margin-bottom:10px;">'
      + '<div class="tags">'+(b.actif
          ? '<span class="tag" style="background:var(--success-soft);color:var(--success-soft-ink);">Actif</span>'
          : '<span class="tag" style="background:var(--danger-soft);color:var(--danger-soft-ink);">Inactif</span>')+'</div>'
      + '<span class="places-badge">'+h+' h données au total</span></div>';

    var formHtml = '<form class="form" id="form-benevole-modale">'
      + enteteHtml
      + '<div class="field-row">'
      + missionChampHtml("Prénom","prenom",true,"text",b.prenom,couleurNommee("accent"))
      + missionChampHtml("Nom","nom",true,"text",b.nom,couleurNommee("accent"))
      + '</div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Email</label><input type="email" value="'+escapeHtml(b.email||"")+'" readonly></div>'
      + missionChampHtml("Téléphone","tel",false,"tel",b.tel||"")
      + '</div>'
      + '<div class="field"><label>Pôles / domaines</label><div class="checkbox-group">'
      + state.poles.map(function(p){ return '<label class="checkbox-chip"><input type="checkbox" name="pole" value="'+escapeHtml(p)+'" '+((b.poles||[]).indexOf(p)>=0?"checked":"")+'> '+escapeHtml(p)+'</label>'; }).join("")
      + '</div></div>'
      + (benevoleModaleError ? '<div class="error-text" style="margin-bottom:8px;">'+escapeHtml(benevoleModaleError)+'</div>' : '')
      + '<div class="form-actions"><button type="submit" class="btn btn-primary" '+(authReady?"":"disabled")+'>💾 Enregistrer les modifications</button>'
      + '<button type="button" class="btn btn-ghost" data-action="cancel-benevole-modale">Annuler</button>'
      + '<button type="button" class="btn btn-ghost" data-action="toggle-actif" data-id="'+b.id+'">'+(b.actif ? "Marquer inactif" : "Marquer actif")+'</button>'
      + '<button type="button" class="btn-danger-ghost" data-action="delete-benevole" data-id="'+b.id+'">Supprimer la fiche</button>'
      + '<button type="button" class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-fiche-benevole" data-id="'+b.id+'">Imprimer la fiche</button>'
      + (authReady ? '' : '<span class="form-hint">Connexion en cours…</span>')
      + '</div>'
      + (b.dateCreation ? '<div class="benevole-contact">Fiche créée le '+fmtDateTime(b.dateCreation)+'</div>' : '')
      + '<div class="modal-section-inscrits"><div class="modal-section-titre">🗓️ HISTORIQUE DES INSCRIPTIONS</div>'
      + (benevoleHistoriqueSectionHtml(b) || '<div class="benevole-contact">Aucune inscription pour l\'instant.</div>')
      + '</div>'
      + '</form>';

    return '<div class="modal-backdrop" data-action="close-modal-benevole">'
      + '<div class="modal-box"><div class="modal-box-head"><h3>'+escapeHtml(b.prenom+' '+b.nom)+'</h3>'
      + '<button type="button" class="modal-close" data-action="cancel-benevole-modale" aria-label="Fermer">✕</button></div>'
      + formHtml + '</div></div>';
  }

  // Fenêtre "Mon historique" (demande de Jluc) : version publique, en
  // lecture seule, de benevoleModaleHtml() ci-dessus — même présentation
  // (bandeau Actif/Inactif + heures données, puis l'historique des
  // inscriptions), mais aucun champ modifiable, aucun bouton de suppression,
  // et pas de lien vers la modale d'édition de mission (voir
  // benevoleHistoriqueSectionHtml). Le bouton "Imprimer" réutilise
  // imprimerFicheBenevole(), déjà utilisée côté Gestionnaire — même mise en
  // page, elle s'adapte déjà à l'absence de connexion (voir
  // impressionPiedHtml).
  function monHistoriqueModaleHtml(){
    var b = moiBenevoleId ? benevoleById(moiBenevoleId) : null;
    if(!b) return "";
    var heuresMap = heuresParBenevole();
    var h = Math.round((heuresMap[b.id]||0)*10)/10;

    var enteteHtml = '<div class="mission-head" style="margin-bottom:10px;">'
      + '<div class="tags">'+(b.actif
          ? '<span class="tag" style="background:var(--success-soft);color:var(--success-soft-ink);">Actif</span>'
          : '<span class="tag" style="background:var(--danger-soft);color:var(--danger-soft-ink);">Inactif</span>')+'</div>'
      + '<span class="places-badge">'+h+' h données au total</span></div>';

    var contenuHtml = '<form class="form">'
      + enteteHtml
      + '<div class="modal-section-inscrits"><div class="modal-section-titre">🗓️ HISTORIQUE DES INSCRIPTIONS</div>'
      + (benevoleHistoriqueSectionHtml(b, true) || '<div class="benevole-contact">Aucune inscription pour l\'instant.</div>')
      + '</div>'
      + '<div class="form-actions"><button type="button" class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-mon-historique">🖨️ Imprimer mon historique</button>'
      + '<button type="button" class="btn btn-ghost" data-action="cancel-mon-historique">Fermer</button></div>'
      + '</form>';

    return '<div class="modal-backdrop" data-action="close-modal-mon-historique">'
      + '<div class="modal-box"><div class="modal-box-head"><h3>Mon historique — '+escapeHtml(b.prenom+' '+b.nom)+'</h3>'
      + '<button type="button" class="modal-close" data-action="cancel-mon-historique" aria-label="Fermer">✕</button></div>'
      + contenuHtml + '</div></div>';
  }

  function renderModal(){
    var racine = document.getElementById("modal-root");
    if(!racine) return;
    var html = "";
    // Ordre important : la fiche bénévole d'abord (en dessous), la mission
    // ensuite (par-dessus) — pour pouvoir ouvrir "Voir la mission" depuis
    // l'historique d'un bénévole sans perdre sa fiche en arrière-plan.
    if(benevoleModaleOpen) html += benevoleModaleHtml();
    if(missionFormOpen) html += missionFormModalHtml();
    if(monHistoriqueOpen) html += monHistoriqueModaleHtml();
    racine.innerHTML = html;
  }

  // L'onglet "Heures données" (qui vivait ici) faisait doublon avec le
  // tableau de l'onglet Bénévoles (Nom/Prénom/Pôles/Heures) : supprimé à la
  // demande de Jluc. Ses deux informations propres (Missions réalisées, tri
  // par nombre de missions) ont été reprises dans le tableau Bénévoles (voir
  // renderBenevoles et imprimerSelectionBenevoles). La tuile "Heures
  // données" du tableau de bord ouvre maintenant l'onglet Bénévoles trié par
  // heures (voir l'action "ouvrir-stat").

  // ---------- render: historique ----------
  var ACTION_LABELS = {
    creation_mission: "Mission créée",
    modification_mission: "Mission modifiée",
    suppression_mission: "Mission supprimée",
    validation: "Mission marquée réalisée",
    annulation_validation: "Validation annulée",
    suppression_inscription: "Inscription supprimée",
    creation_benevole: "Bénévole ajouté",
    modification_benevole: "Fiche bénévole modifiée",
    suppression_benevole: "Bénévole supprimé",
    validation_candidature: "Candidature validée",
    refus_candidature: "Candidature refusée",
    ajout_gestionnaire: "Gestionnaire ajouté",
    desactivation_gestionnaire: "Gestionnaire désactivé",
    reactivation_gestionnaire: "Gestionnaire réactivé",
    modification_email_candidature: "Email de candidature modifié",
    import_donnees: "Données importées",
    inscription_publique: "Inscription publique à une mission",
    reinitialisation_application: "Application réinitialisée"
  };

  // Libellé du rôle affiché dans la colonne "Par" de l'historique. Ajouté
  // avec la trace des inscriptions publiques : sans ça, un visiteur non
  // connecté (parRole "public") s'affichait à tort comme "Gestionnaire".
  function libelleRoleHistorique(parRole){
    if(parRole === "directeur") return "Directeur";
    if(parRole === "public") return "Visiteur";
    return "Gestionnaire";
  }

  var historiqueRecherche = "";
  var historiqueTri = "date"; // "date" (plus récent d'abord) | "action" | "cible" | "par"
  var historiqueSelection = {}; // { [historiqueId]: true } — cases cochées pour l'impression

  function renderHistorique(){
    var recherche = historiqueRecherche.trim().toLowerCase();

    // Recherche générale : date, action, concerne ou personne.
    var rows = state.historique.filter(function(h){
      if(!recherche) return true;
      var actionLabel = (ACTION_LABELS[h.action]||h.action||"").toLowerCase();
      var parLabel = (h.parNom||"") + " " + (h.parRole==="directeur"?"directeur":"gestionnaire");
      var dateTxt = fmtDateTime(h.date).toLowerCase();
      return actionLabel.indexOf(recherche) >= 0
        || (h.cible||"").toLowerCase().indexOf(recherche) >= 0
        || parLabel.toLowerCase().indexOf(recherche) >= 0
        || dateTxt.indexOf(recherche) >= 0;
    });

    // Tri par Date (par défaut, le plus récent d'abord) ou par Action,
    // Concerne, Par (ordre alphabétique) ; à égalité, les plus récents
    // d'abord.
    rows.sort(function(a,b){
      var ta = a.date && a.date.toMillis ? a.date.toMillis() : 0;
      var tb = b.date && b.date.toMillis ? b.date.toMillis() : 0;
      if(historiqueTri === "action"){
        var la = ACTION_LABELS[a.action]||a.action||"";
        var lb = ACTION_LABELS[b.action]||b.action||"";
        var cmpAction = la.localeCompare(lb, "fr", {sensitivity:"base"});
        if(cmpAction !== 0) return cmpAction;
      } else if(historiqueTri === "cible"){
        var cmpCible = (a.cible||"").localeCompare(b.cible||"", "fr", {sensitivity:"base"});
        if(cmpCible !== 0) return cmpCible;
      } else if(historiqueTri === "par"){
        var cmpPar = (a.parNom||"").localeCompare(b.parNom||"", "fr", {sensitivity:"base"});
        if(cmpPar !== 0) return cmpPar;
      }
      return tb - ta;
    });

    var trs = rows.map(function(h){
      var coche = !!historiqueSelection[h.id];
      return '<tr><td class="col-select"><input type="checkbox" data-action="toggle-select-historique" data-id="'+h.id+'" '+(coche?"checked":"")+'></td>'
        + '<td>'+fmtDateTime(h.date)+'</td><td>'+escapeHtml(ACTION_LABELS[h.action]||h.action)+'</td>'
        + '<td>'+escapeHtml(h.cible||"")+'</td><td>'+escapeHtml(h.parNom||"")+' ('+libelleRoleHistorique(h.parRole)+')</td></tr>';
    }).join("");

    // En-têtes cliquables, même principe que pour Bénévoles ou Missions.
    function thTri(label, triKey){
      var active = historiqueTri === triKey;
      return '<th><button type="button" class="th-tri'+(active?" active":"")+'" data-action="trier-historique" data-tri="'+triKey+'">'
        + label + (active ? ' <span class="tri-arrow">▼</span>' : '')
        + '</button></th>';
    }

    var touTochesHi = rows.length > 0 && rows.every(function(h){ return historiqueSelection[h.id]; });
    var nbSelectionnesHi = state.historique.filter(function(h){ return historiqueSelection[h.id]; }).length;
    // Toujours affichés, juste désactivés si rien n'est coché.
    var imprimerBtnHi = '<button class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-selection-historique"'+(nbSelectionnesHi>0?"":" disabled")+'>Imprimer la sélection ('+nbSelectionnesHi+')</button>'
      + '<button class="btn btn-badge badge-vider btn-sm" data-action="vider-selection-historique"'+(nbSelectionnesHi>0?"":" disabled")+'>Vider la sélection</button>';

    document.getElementById("panel-historique").innerHTML =
      '<div class="toolbar"><h2>Historique</h2>'
      + '<div style="display:flex;gap:8px;">'+imprimerBtnHi+'</div></div>'
      + '<div class="field" style="max-width:420px;margin-bottom:14px;"><label for="historique-recherche">Recherche</label>'
      + '<input type="search" id="historique-recherche" placeholder="Date, action, concerne ou personne…" value="'+escapeHtml(historiqueRecherche)+'"></div>'
      + (rows.length ? '<div class="table-scroll"><table class="heures-table"><thead><tr>'
          + '<th class="col-select"><input type="checkbox" data-action="toggle-select-all-historique" '+(touTochesHi?"checked":"")+'></th>'
          + thTri("Date","date") + thTri("Action","action") + thTri("Concerne","cible") + thTri("Par","par")
          + '</tr></thead><tbody>'+trs+'</tbody></table></div>'
        : '<div class="empty-state">'+(state.historique.length ? 'Aucune entrée ne correspond.' : 'Aucune action enregistrée pour l\'instant.')+'</div>');
  }

  // ---------- render: équipe (gestionnaires) ----------
  function renderEquipe(){
    var rows = state.gestionnaires.map(function(g){
      var pillCls = "role-pill" + (g.role==="directeur" ? " directeur" : "");
      var actionsHtml = "";
      if(role === "directeur" && g.role !== "directeur"){
        actionsHtml = '<button class="btn btn-ghost btn-sm" data-action="toggle-gestionnaire" data-id="'+g.id+'">'+(g.actif ? "Désactiver" : "Réactiver")+'</button>';
      }
      return '<div class="list-row"><div class="list-row-main"><span class="list-row-title">'+escapeHtml(g.nom)+'</span>'
        + '<span class="list-row-meta">'+escapeHtml(g.email||"—")+' · '+(g.actif ? "Actif" : "Inactif")+'</span></div>'
        + '<div style="display:flex;align-items:center;gap:10px;"><span class="'+pillCls+'">'+(g.role==="directeur"?"Directeur":"Gestionnaire")+'</span>'+actionsHtml+'</div></div>';
    }).join("");

    var formHtml = "";
    if(role === "directeur" && gestionnaireFormOpen){
      formHtml = '<form class="form" id="form-gestionnaire">'
        + '<div class="field-row">'
        + '<div class="field"><label for="g-nom">Nom complet</label><input id="g-nom" name="nom" required></div>'
        + '<div class="field"><label for="g-email">Email (réel, pour la récupération du code)</label><input id="g-email" name="email" type="email" required></div>'
        + '<div class="field"><label for="g-code">Code initial (6 caractères min.)</label><input id="g-code" name="code" type="text" minlength="6" required></div>'
        + '</div>'
        + '<div class="form-actions"><button type="submit" class="btn btn-primary">Ajouter ce gestionnaire</button>'
        + '<button type="button" class="btn btn-ghost" data-action="cancel-gestionnaire">Annuler</button>'
        + (gestionnaireError ? '<span class="error-text">'+escapeHtml(gestionnaireError)+'</span>' : '')
        + '</div></form>';
    }

    document.getElementById("panel-equipe").innerHTML =
      '<div class="toolbar"><div><h2>Équipe</h2><div class="toolbar-meta">Personnes habilitées à créer des missions et à valider les présences</div></div>'
      + (role === "directeur" ? '<button class="btn btn-primary" data-action="open-gestionnaire">+ Ajouter un gestionnaire</button>' : '')
      + '</div>'
      + formHtml
      + (rows || '<div class="empty-state">Aucun gestionnaire pour l\'instant.</div>');
  }

  // ---------- render: paramètres (pôles, statuts des missions) ----------
  function renderParametres(){
    var lignesPoles = state.poles.map(function(p){
      return '<div class="list-row"><div class="list-row-main"><span class="list-row-title">'+escapeHtml(p)+'</span></div>'
        + '<button class="btn-danger-ghost" data-action="delete-pole" data-pole="'+escapeHtml(p)+'" title="Retirer">✕</button></div>';
    }).join("");

    var lignesStatuts = state.statutsMissions.map(function(s){
      return '<div class="list-row"><div class="list-row-main"><span class="list-row-title">'+escapeHtml(s)+'</span></div>'
        + '<button class="btn-danger-ghost" data-action="delete-statut" data-statut="'+escapeHtml(s)+'" title="Retirer">✕</button></div>';
    }).join("");

    document.getElementById("panel-parametres").innerHTML =
      '<div class="toolbar"><div><h2>Paramètres</h2><div class="toolbar-meta">Pôles / domaines et statuts proposés dans les formulaires</div></div></div>'
      + '<div class="form-hint" style="margin-bottom:18px;">Les nouvelles candidatures apparaissent dans l\'onglet Candidatures : pensez à le consulter régulièrement pour les valider.</div>'
      + '<h3 style="margin:0 0 8px;">Pôles / domaines</h3>'
      + '<form class="form" id="form-pole"><div class="field-row">'
      + '<div class="field"><label for="p-nom">Nouveau pôle</label><input id="p-nom" name="nom" required placeholder="Ex : Jardinage"></div>'
      + '</div><div class="form-actions"><button type="submit" class="btn btn-primary">Ajouter ce pôle</button></div></form>'
      + (lignesPoles || '<div class="empty-state">Aucun pôle défini.</div>')
      + '<div class="form-hint" style="margin:10px 0 26px;">Retirer un pôle ne modifie pas les bénévoles ou missions qui l\'utilisent déjà — seuls les nouveaux formulaires ne le proposeront plus.</div>'
      + '<h3 style="margin:0 0 8px;">Statuts des missions</h3>'
      + '<form class="form" id="form-statut"><div class="field-row">'
      + '<div class="field"><label for="p-statut-nom">Nouveau statut</label><input id="p-statut-nom" name="nom" required placeholder="Ex : Annulée"></div>'
      + '</div><div class="form-actions"><button type="submit" class="btn btn-primary">Ajouter ce statut</button></div></form>'
      + (lignesStatuts || '<div class="empty-state">Aucun statut défini.</div>')
      + '<div class="form-hint" style="margin-top:10px;">Chaque mission a un statut (visible et modifiable par les gestionnaires/Directeur, pas par le public), utile pour suivre où elle en est et faire un retour aux responsables de pôle. Retirer un statut ne modifie pas les missions qui l\'utilisent déjà.</div>';
  }

  // ---------- render: données (export / import) ----------

  function renderAll(){
    updateTabsVisibility();
    renderAdminRow();
    renderStats();
    if(currentTab==="benevoles") renderBenevoles();
    if(currentTab==="missions") renderMissions();
    if(currentTab==="historique") renderHistorique();
    if(currentTab==="equipe") renderEquipe();
    if(currentTab==="candidatures") renderCandidatures();
    if(currentTab==="parametres") renderParametres();
    if(currentTab==="donnees") renderDonnees();
    // Toujours rendu, quel que soit l'onglet actif : les modales "mission"
    // (voir / créer / modifier) doivent pouvoir rester ouvertes par-dessus
    // n'importe quel onglet, notamment Bénévoles (voir renderModal()).
    renderModal();
  }

  function updateTabsVisibility(){
    var benevolesTab = document.querySelector('[data-tab="benevoles"]');
    var histTab = document.querySelector('[data-tab="historique"]');
    var equipeTab = document.querySelector('[data-tab="equipe"]');
    var candidaturesTab = document.querySelector('[data-tab="candidatures"]');
    var paramTab = document.querySelector('[data-tab="parametres"]');
    var donneesTab = document.querySelector('[data-tab="donnees"]');
    var visible = role !== "public";
    var directeurSeul = role === "directeur";
    // Le public n'a plus d'usage de l'onglet Bénévoles : les autres fiches
    // ne lui sont pas montrées et l'envoi de candidature se fait depuis
    // l'onglet Missions (voir renderMissions()).
    benevolesTab.hidden = !visible;
    histTab.hidden = !visible;
    equipeTab.hidden = !visible;
    candidaturesTab.hidden = !visible;
    paramTab.hidden = !directeurSeul;
    donneesTab.hidden = !directeurSeul;
    if(!visible && (currentTab === "benevoles" || currentTab === "historique" || currentTab === "equipe" || currentTab === "candidatures")){
      switchTab("missions");
    }
    if(!directeurSeul && (currentTab === "parametres" || currentTab === "donnees")){
      switchTab("missions");
    }
  }

  function switchTab(name){
    currentTab = name;
    document.querySelectorAll(".tab").forEach(function(b){
      b.setAttribute("aria-selected", b.getAttribute("data-tab")===name ? "true" : "false");
    });
    ["benevoles","missions","historique","equipe","candidatures","parametres","donnees"].forEach(function(t){
      document.getElementById("panel-"+t).hidden = (t !== name);
    });
  }

  // ---------- tabs ----------
  document.querySelectorAll(".tab").forEach(function(btn){
    btn.addEventListener("click", function(){
      switchTab(btn.getAttribute("data-tab"));
      renderAll();
    });
  });

  // ---------- impression des lignes sélectionnées (Bénévoles / Missions) ----------
  // Construit une page condensée (mêmes colonnes que le tableau à l'écran,
  // une ligne par élément coché) dans #impression, puis lance l'impression
  // du navigateur. Le CSS @media print masque tout le reste de la page (voir
  // la balise <style> en haut du fichier) : aucune bibliothèque externe.
  // Mise en page calquée sur celle de PICS : entête (nom + sous-titre à
  // gauche, date du jour à droite), trait bleu, titre avec le nombre de
  // lignes, tableau, puis en pied de page une signature horodatée (la
  // personne connectée qui imprime, avec la date et l'heure) à gauche et le
  // nom de l'association à droite.
  function fmtAujourdhui(){
    return new Date().toLocaleDateString("fr-FR");
  }
  function fmtMaintenant(){
    var d = new Date();
    return d.toLocaleDateString("fr-FR") + " à " + d.toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
  }

  function impressionEnteteHtml(){
    return '<div class="impression-entete">'
      + '<div><div class="impression-titre-app"><span class="impression-logo">🌿</span>Maison Pour Tous des Rancy</div>'
      + '<div class="impression-soustitre">Gestion des bénévoles</div></div>'
      + '<div class="impression-date">'+fmtAujourdhui()+'</div>'
      + '</div>'
      + '<div class="impression-trait"></div>';
  }

  // Signature horodatée : le nom de la personne connectée qui imprime (avec
  // son rôle), suivi de la date et l'heure d'impression — moiNom est le nom
  // de la personne actuellement connectée (voir écoute onAuthStateChanged).
  function impressionPiedHtml(section){
    var signataire = moiNom ? (moiNom + ' — ' + (role==="directeur" ? "Directeur" : "Gestionnaire")) : "Maison Pour Tous des Rancy";
    return '<div class="impression-pied">'
      + '<div>'+escapeHtml(signataire)+'<br>Imprimé le '+fmtMaintenant()+'</div>'
      + '<div>Maison Pour Tous des Rancy — '+section+'</div>'
      + '</div>';
  }

  // Même signal qu'à l'écran (voir missionCardHtml) : une mission "À
  // vérifier" attend une action du gestionnaire, on la met en évidence à
  // l'impression comme PICS le fait pour une échéance qui réclame
  // attention. Utilisé par imprimerSelectionMissions et imprimerFicheMission.
  function impressionStatutMissionHtml(m){
    return statutMission(m) === "À vérifier"
      ? '<span class="impression-alerte">⚠ À vérifier</span>'
      : escapeHtml(statutMission(m));
  }

  function imprimerSelectionBenevoles(){
    var heuresMap = heuresParBenevole();
    var missionsMap = {};
    state.affectations.forEach(function(a){
      if(a.statut === "realise") missionsMap[a.benevoleId] = (missionsMap[a.benevoleId]||0) + 1;
    });
    var liste = state.benevoles.filter(function(b){ return benevolesSelection[b.id]; });
    var lignes = liste.map(function(b){
      var h = Math.round((heuresMap[b.id]||0)*10)/10;
      var missionsRealisees = missionsMap[b.id]||0;
      return '<tr><td class="impression-col-principale">'+escapeHtml(b.nom)+'</td><td>'+escapeHtml(b.prenom)+'</td>'
        + '<td>'+escapeHtml((b.poles||[]).join(", "))+'</td><td>'+missionsRealisees+'</td><td>'+h+' h</td></tr>';
    }).join("");
    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>Bénévoles ('+liste.length+')</h2>'
      + '<table><thead><tr><th>Nom</th><th>Prénom</th><th>Pôles</th><th>Missions réalisées</th><th>Heures données</th></tr></thead>'
      + '<tbody>'+lignes+'</tbody></table>'
      + impressionPiedHtml("Bénévoles");
    window.print();
  }

  // Résumé + tableau (ou ligne "Aucune inscription") de l'historique des
  // réalisations d'un bénévole, pour l'impression — utilisé à la fois pour
  // le bloc par bénévole d'imprimerHistoriqueBenevoles (plusieurs bénévoles
  // à la suite) et pour la fiche imprimable d'un seul bénévole
  // (imprimerFicheBenevole, depuis la modale). Toujours le détail complet
  // (réalisées, à venir, non réalisées), rien de résumé ou de tronqué.
  function impressionHistoriqueRealisationsHtml(b){
    var inscriptions = inscriptionsDe(b.id);
    if(!inscriptions.length){
      return '<div class="impression-vide">Aucune inscription enregistrée.</div>';
    }
    var nbRealisees = inscriptions.filter(function(x){ return x.statut === "realisee"; }).length;
    var nbAvenir = inscriptions.filter(function(x){ return x.statut === "avenir"; }).length;
    var nbNonRealisees = inscriptions.filter(function(x){ return x.statut === "nonrealisee"; }).length;
    var lignes = inscriptions.map(function(x){
      var detail = x.statut === "realisee" ? (" · "+dureeHeures(x.mission)+" h") : "";
      return '<tr><td>'+fmtDateCourt(x.mission.date)+'</td><td class="impression-col-principale">'+escapeHtml(libelleMission(x.mission))+'</td>'
        + '<td class="'+CLASSE_STATUT_INSCRIPTION[x.statut]+'">'+LIBELLE_STATUT_INSCRIPTION[x.statut]+detail+'</td></tr>';
    }).join("");
    return '<div class="impression-resume">'+nbRealisees+' réalisée(s) · '+nbAvenir+' à venir · '+nbNonRealisees+' non réalisée(s)</div>'
      + '<table><thead><tr><th>Date</th><th>Mission</th><th>Statut</th></tr></thead>'
      + '<tbody>'+lignes+'</tbody></table>';
  }

  // Impression de l'historique complet des inscriptions (réalisées / à
  // venir / non réalisées) des bénévoles sélectionnés — volontairement
  // séparée du bouton "Imprimer la sélection" (qui reste le tableau simple
  // Nom/Prénom/Pôles/Heures) : chaque bénévole a ici son propre bloc, bien
  // délimité des autres, avec le détail mission par mission.
  function imprimerHistoriqueBenevoles(){
    var liste = state.benevoles.filter(function(b){ return benevolesSelection[b.id]; });
    var blocs = liste.map(function(b){
      return '<div class="impression-bloc-benevole">'
        + '<h3>'+escapeHtml(b.prenom)+' '+escapeHtml(b.nom)+'</h3>'
        + impressionHistoriqueRealisationsHtml(b)
        + '</div>';
    }).join("");
    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>Historique complet des inscriptions ('+liste.length+' bénévole'+(liste.length>1?"s":"")+')</h2>'
      + blocs
      + impressionPiedHtml("Historique des bénévoles");
    window.print();
  }

  // Impression de la fiche d'UN SEUL bénévole (bouton "Imprimer la fiche"
  // dans la modale) : ses informations, puis tout l'historique de ses
  // réalisations en détail — sur le même principe qu'une fiche d'action
  // PICS (informations de l'action, puis historique complet des échanges).
  function imprimerFicheBenevole(id){
    var b = benevoleById(id);
    if(!b) return;
    var heuresMap = heuresParBenevole();
    var h = Math.round((heuresMap[b.id]||0)*10)/10;

    var ficheHtml = '<table><thead><tr><th>Nom</th><th>Prénom</th><th>Email</th><th>Téléphone</th><th>Pôles</th><th>Statut</th><th>Heures données</th></tr></thead>'
      + '<tbody><tr><td class="impression-col-principale">'+escapeHtml(b.nom)+'</td><td>'+escapeHtml(b.prenom)+'</td>'
      + '<td>'+escapeHtml(b.email||"—")+'</td><td>'+escapeHtml(b.tel||"—")+'</td>'
      + '<td>'+escapeHtml((b.poles||[]).join(", ")||"—")+'</td>'
      + '<td>'+(b.actif ? "Actif" : '<span class="impression-alerte">Inactif</span>')+'</td>'
      + '<td>'+h+' h</td></tr></tbody></table>';

    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>'+escapeHtml(b.prenom)+' '+escapeHtml(b.nom)+'</h2>'
      + ficheHtml
      + '<h3 class="impression-sous-titre">Historique des réalisations</h3>'
      + impressionHistoriqueRealisationsHtml(b)
      + impressionPiedHtml("Fiche bénévole");
    window.print();
  }

  function imprimerSelectionMissions(){
    var liste = state.missions.filter(function(m){ return missionsSelection[m.id]; });
    // Classées par Statut (demande de Jluc) : dans l'ordre du cycle de vie
    // défini dans Paramètres (En cours, À vérifier, Terminée, Non
    // effectuée…) plutôt que par ordre alphabétique, pour que la liste
    // imprimée se lise comme un vrai suivi d'avancement. À statut égal, la
    // mission la plus proche dans le temps d'abord.
    liste = liste.slice().sort(function(a, b){
      var ia = state.statutsMissions.indexOf(statutMission(a));
      var ib = state.statutsMissions.indexOf(statutMission(b));
      if(ia === -1) ia = state.statutsMissions.length;
      if(ib === -1) ib = state.statutsMissions.length;
      if(ia !== ib) return ia - ib;
      var da = (a.date||"") + " " + (a.debut||"");
      var db = (b.date||"") + " " + (b.debut||"");
      return da < db ? -1 : (da > db ? 1 : 0);
    });
    var lignes = liste.map(function(m){
      var restantes = placesRestantes(m);
      var badgeTxt = restantes <= 0 ? "Complet" : (restantes + " place" + (restantes>1?"s":"") + " restante" + (restantes>1?"s":""));
      var nbInscrits = inscritsDe(m.id).length;
      return '<tr><td>'+impressionStatutMissionHtml(m)+'</td><td>'+fmtDate(m.date)+' · '+m.debut+'–'+m.fin+'</td><td class="impression-col-principale">'+escapeHtml(libelleMission(m))+'</td>'
        + '<td>'+escapeHtml(m.pole||"")+'</td><td>'+escapeHtml(m.lieu)+'</td>'
        + '<td>'+badgeTxt+'</td><td>'+nbInscrits+'</td></tr>';
    }).join("");
    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>Missions ('+liste.length+')</h2>'
      + '<table><thead><tr><th>Statut</th><th>Date</th><th>Titre</th><th>Pôle</th><th>Lieu</th><th>Places</th><th>Inscrits</th></tr></thead>'
      + '<tbody>'+lignes+'</tbody></table>'
      + impressionPiedHtml("Missions");
    window.print();
  }

  // Impression de la fiche d'UNE SEULE mission (bouton "Imprimer la fiche"
  // dans la modale mission) : ses informations, puis tout l'historique des
  // bénévoles qui s'y sont inscrits (réalisé / à venir / non réalisé) —
  // même principe que la fiche bénévole (imprimerFicheBenevole) et qu'une
  // fiche d'action PICS (infos de l'action, puis historique complet).
  function imprimerFicheMission(id){
    var m = missionById(id);
    if(!m) return;
    var inscrits = inscritsAvecStatutDe(id);

    var ficheHtml = '<table><thead><tr><th>Statut</th><th>Date</th><th>Horaire</th><th>Durée</th><th>Pôle</th><th>Lieu</th><th>Places</th></tr></thead>'
      + '<tbody><tr><td>'+impressionStatutMissionHtml(m)+'</td><td>'+fmtDate(m.date)+'</td>'
      + '<td>'+m.debut+'–'+m.fin+'</td><td>'+dureeHeures(m)+' h</td>'
      + '<td>'+escapeHtml(m.pole||"—")+'</td><td>'+escapeHtml(m.lieu||"—")+'</td>'
      + '<td>'+inscrits.length+' / '+m.placesTotal+'</td></tr></tbody></table>';

    var notesHtml = (m.description ? '<div class="impression-resume">'+escapeHtml(m.description)+'</div>' : '')
      + (m.commentaires ? '<div class="impression-resume"><strong>Commentaires : </strong>'+escapeHtml(m.commentaires)+'</div>' : '');

    var historiqueHtml;
    if(!inscrits.length){
      historiqueHtml = '<div class="impression-vide">Aucun bénévole inscrit.</div>';
    } else {
      var nbRealisees = inscrits.filter(function(x){ return x.statut === "realisee"; }).length;
      var nbAvenir = inscrits.filter(function(x){ return x.statut === "avenir"; }).length;
      var nbNonRealisees = inscrits.filter(function(x){ return x.statut === "nonrealisee"; }).length;
      var lignes = inscrits.map(function(x){
        var detail = x.statut === "realisee" ? (" · "+dureeHeures(m)+" h") : "";
        return '<tr><td class="impression-col-principale">'+escapeHtml(x.benevole.prenom)+' '+escapeHtml(x.benevole.nom)+'</td>'
          + '<td>'+escapeHtml(x.benevole.email||"—")+'</td>'
          + '<td class="'+CLASSE_STATUT_INSCRIPTION[x.statut]+'">'+LIBELLE_STATUT_INSCRIPTION[x.statut]+detail+'</td></tr>';
      }).join("");
      historiqueHtml = '<div class="impression-resume">'+nbRealisees+' réalisée(s) · '+nbAvenir+' à venir · '+nbNonRealisees+' non réalisée(s)</div>'
        + '<table><thead><tr><th>Bénévole</th><th>Email</th><th>Statut</th></tr></thead>'
        + '<tbody>'+lignes+'</tbody></table>';
    }

    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>'+escapeHtml(libelleMission(m))+'</h2>'
      + ficheHtml
      + notesHtml
      + '<h3 class="impression-sous-titre">Historique des réalisations</h3>'
      + historiqueHtml
      + impressionPiedHtml("Fiche mission");
    window.print();
  }

  // Historique des actions, imprimé façon journal chronologique (comme
  // "Historique des échanges" dans PICS) plutôt qu'en tableau à colonnes :
  // plus lisible pour une suite d'évènements datés, et plus concis quand
  // "Concerne" ou l'auteur sont vides.
  function imprimerSelectionHistorique(){
    var liste = state.historique.filter(function(h){ return historiqueSelection[h.id]; });
    var evenements = liste.map(function(h){
      return '<div class="impression-evenement">'
        + '<div class="impression-evenement-date">'+fmtDateTime(h.date)+'</div>'
        + '<div class="impression-evenement-action">'+escapeHtml(ACTION_LABELS[h.action]||h.action)+'</div>'
        + (h.cible ? '<div class="impression-evenement-detail">'+escapeHtml(h.cible)+'</div>' : '')
        + '<div class="impression-evenement-detail">Par '+escapeHtml(h.parNom||"—")+' ('+libelleRoleHistorique(h.parRole)+')</div>'
        + '</div>';
    }).join("");
    document.getElementById("impression").innerHTML =
      impressionEnteteHtml()
      + '<h2>Historique ('+liste.length+')</h2>'
      + (evenements || '<div class="impression-vide">Aucun évènement sélectionné.</div>')
      + impressionPiedHtml("Historique");
    window.print();
  }

  // ---------- delegated actions ----------
  document.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action==="open-benevole"){ benevoleFormOpen = true; benevoleError=""; renderBenevoles(); }
    else if(action==="cancel-benevole"){ benevoleFormOpen = false; renderBenevoles(); }
    else if(action==="open-candidature"){ candidatureFormOpen = true; candidatureError=""; candidatureEnvoyee=false; renderMissions(); }
    else if(action==="cancel-candidature"){ candidatureFormOpen = false; renderMissions(); }
    else if(action==="open-mission"){ missionFormOpen = true; missionEnEdition = null; missionFormError = ""; renderModal(); }
    else if(action==="edit-mission"){
      var idAModifier = el.getAttribute("data-id");
      if(!missionById(idAModifier)){ alert("Cette mission n'existe plus."); return; }
      missionFormOpen = true; missionEnEdition = idAModifier; missionFormError = ""; renderModal();
    }
    else if(action==="cancel-mission"){ missionFormOpen = false; missionEnEdition = null; missionFormError = ""; renderModal(); }
    else if(action==="close-modal-mission"){
      // Ne ferme que si le clic est bien sur le fond gris lui-même, pas sur
      // un élément à l'intérieur de la boîte (le fond englobe toute la
      // boîte, donc closest() le retrouverait aussi pour un clic dedans).
      if(e.target === el){ missionFormOpen = false; missionEnEdition = null; missionFormError = ""; renderModal(); }
    }
    else if(action==="open-benevole-modale"){
      var idBenevole = el.getAttribute("data-id");
      if(!benevoleById(idBenevole)){ alert("Cette fiche n'existe plus."); return; }
      benevoleModaleOpen = true; benevoleModaleId = idBenevole; benevoleModaleError = ""; renderModal();
    }
    else if(action==="cancel-benevole-modale"){ benevoleModaleOpen = false; benevoleModaleId = null; benevoleModaleError = ""; renderModal(); }
    else if(action==="close-modal-benevole"){
      if(e.target === el){ benevoleModaleOpen = false; benevoleModaleId = null; benevoleModaleError = ""; renderModal(); }
    }
    else if(action==="open-login"){ loginFormOpen = true; loginError=""; loginInfo=""; renderAdminRow(); }
    else if(action==="cancel-login"){ loginFormOpen = false; loginError=""; loginInfo=""; renderAdminRow(); }
    else if(action==="open-gestionnaire"){ gestionnaireFormOpen = true; gestionnaireError=""; renderEquipe(); }
    else if(action==="cancel-gestionnaire"){ gestionnaireFormOpen = false; renderEquipe(); }
    else if(action==="logout"){
      detachRoleCollections();
      detachPublicCollections();
      signOut(auth).then(function(){ return signInAnonymously(auth); }).catch(reportError);
    }
    else if(action==="mdp-oublie"){
      var form = document.getElementById("form-login");
      var email = form && form.email.value.trim();
      if(!email){ loginError = "Indique ton email d'abord."; renderAdminRow(); return; }
      sendPasswordResetEmail(auth, email).then(function(){
        loginError = ""; loginInfo = "Email envoyé si ce compte existe.";
        renderAdminRow();
      }).catch(function(){
        loginInfo = "Email envoyé si ce compte existe.";
        renderAdminRow();
      });
    }

        logHistorique("suppression_mission", mDel ? libelleMission(mDel) : "");

    else if(action==="export-json"){
      // Corrigé : il y avait deux blocs "export-json" identiques (un mort,
      // jamais exécuté) — celui qui s'exécutait réellement oubliait les
      // pôles. Un seul bloc désormais, qui inclut bien la liste des pôles.
      var exportData = {
        exporteLe: new Date().toISOString(),
        poles: state.poles,
        benevoles: state.benevoles,

        historique: state.historique

      var jsonStr = JSON.stringify(exportData, null, 2);

    else if(action==="ouvrir-stat"){
      var statKey = el.getAttribute("data-stat");
      // On repart toujours d'un onglet sans filtre ni sélection avant de
      // poser celui de la tuile cliquée : sinon un filtre (ou une case
      // cochée) laissé par une visite précédente de l'onglet se combinait
      // avec celui de la tuile, et cliquer sur les tuiles à la suite finissait
      // par ne plus rien afficher (signalé par Jluc).
      if(statKey === "actifs"){
        resetFiltresBenevoles();
        benevolesFiltreEtat = "actif";
        switchTab("benevoles");
      } else if(statKey === "incomplet" || statKey === "places"){
        // Les deux tuiles renvoient à la même vue : ce sont les missions
        // incomplètes qui ont des places disponibles à pourvoir.
        resetFiltresMissions();
        missionsFiltreDispo = "incomplete";
        switchTab("missions");
      } else if(statKey === "heures"){
        resetFiltresBenevoles();
        benevolesTri = "heures";
        switchTab("benevoles");
      } else if(statKey === "averifier"){
        resetFiltresMissions();

      renderAll();

  // Les tuiles cliquables du tableau de bord sont accessibles au clavier

  document.addEventListener("keydown", function(e){

      var elStat = e.target.closest && e.target.closest('[data-action="ouvrir-stat"]');
      if(elStat){ e.preventDefault(); elStat.click(); }

      benevolesRecherche = e.target.value;

      renderBenevoles();
      var champ2 = document.getElementById("benevoles-recherche");
      if(champ2){ champ2.focus(); champ2.setSelectionRange(pos2,pos2); }
    }

        logHistorique("modification_benevole", champsBenevole.prenom + " " + champsBenevole.nom);
        benevoleModaleOpen = false; benevoleModaleId = null; benevoleModaleError = ""; renderModal();
      }).catch(function(err){
        benevoleModaleError = "Erreur, réessayez.";
        renderModal();
      });
    }
    if(e.target.id === "form-mission"){
      e.preventDefault();
      var f2 = e.target;
      var titre = f2.titre.value.trim();
      var placesSaisies = Math.max(1, parseInt(f2.placesTotal.value,10) || 1);
      var champs = {
        titre: titre,
        pole: f2.pole.value,
        statut: f2.statut.value,
        date: f2.date.value,
        lieu: f2.lieu.value.trim(),
        debut: f2.debut.value,
        fin: f2.fin.value,
        placesTotal: placesSaisies,
        description: f2.description.value.trim(),
        commentaires: f2.commentaires.value.trim()
      };

      if(missionEnEdition){
        // Modification d'une mission existante : on garde son numéro (M1,
        // M2...), sa date de création et son créateur d'origine — seuls les
        // champs du formulaire changent. On refuse de passer sous le nombre
        // de bénévoles déjà inscrits, pour ne pas créer de surbooking.
        var nbInscritsActuels = inscritsDe(missionEnEdition).length;
        if(placesSaisies < nbInscritsActuels){
          missionFormError = "Impossible : " + nbInscritsActuels + " bénévole(s) déjà inscrit(s), on ne peut pas descendre en dessous.";
          renderModal();
          return;
        }
        var missionAvant = missionById(missionEnEdition);
        updateDoc(doc(db,"missions", missionEnEdition), champs).then(function(){
          logHistorique("modification_mission", libelleMission(Object.assign({}, missionAvant, champs)));
          missionFormOpen = false; missionEnEdition = null; missionFormError = ""; renderModal();
        }).catch(reportError);
      } else {
        var numeroMission = prochainNumeroMission();
        addDoc(collection(db,"missions"), Object.assign({}, champs, {
          numero: numeroMission,
          creePar: moiNom,
          creeLe: serverTimestamp()
        })).then(function(){
          logHistorique("creation_mission", "M"+numeroMission+" — "+titre);
          missionFormOpen = false; renderModal();
        }).catch(reportError);
      }
    }
    if(e.target.id === "form-pole"){
      e.preventDefault();
      var fp = e.target;
      var nomPole = fp.nom.value.trim();
      if(!nomPole) return;
      var nouvelleListePoles = state.poles.concat([nomPole]).filter(function(v,i,arr){ return arr.indexOf(v) === i; });
      setDoc(doc(db,"parametres","poles"), {liste: nouvelleListePoles}, {merge:true}).then(function(){
        fp.reset();
      }).catch(reportError);
    }
    if(e.target.id === "form-statut"){
      e.preventDefault();
      var fs = e.target;
      var nomStatut = fs.nom.value.trim();
      if(!nomStatut) return;
      var nouvelleListeStatuts = state.statutsMissions.concat([nomStatut]).filter(function(v,i,arr){ return arr.indexOf(v) === i; });
      setDoc(doc(db,"parametres","poles"), {statutsMissions: nouvelleListeStatuts}, {merge:true}).then(function(){
        fs.reset();
      }).catch(reportError);
    }
  });

  function importerDonnees(data){
    var promesses = [];
    var nbPolesAjoutes = 0;
    // Restaure les pôles du fichier exporté : ajoutés à la liste actuelle
    // sans rien retirer (même logique que pour bénévoles/missions/inscriptions
    // ci-dessous — un import ne supprime jamais ce qui existe déjà en ligne).
    if(Array.isArray(data.poles) && data.poles.length){
      var polesFusionnes = state.poles.concat(data.poles).filter(function(p, i, arr){
        return p && arr.indexOf(p) === i;
      });
      nbPolesAjoutes = polesFusionnes.length - state.poles.length;
      if(nbPolesAjoutes > 0){
        promesses.push(setDoc(doc(db,"parametres","poles"), {liste: polesFusionnes}, {merge:true}));
      }
    }
    (data.benevoles||[]).forEach(function(b){
      if(!b || !b.id) return;
      var copie = Object.assign({}, b);
      delete copie.id;
      promesses.push(setDoc(doc(db,"benevoles", b.id), copie));
    });
    (data.missions||[]).forEach(function(m){
      if(!m || !m.id) return;
      var copie = Object.assign({}, m);
      delete copie.id;
      promesses.push(setDoc(doc(db,"missions", m.id), copie));
    });
    (data.affectations||[]).forEach(function(a){
      if(!a || !a.id) return;
      var copie = Object.assign({}, a);
      delete copie.id;
      promesses.push(setDoc(doc(db,"affectations", a.id), copie));
    });
    Promise.all(promesses).then(function(){
      importStatus = "Import terminé : " + (data.benevoles||[]).length + " bénévole(s), " + (data.missions||[]).length + " mission(s), " + (data.affectations||[]).length + " inscription(s)"
        + (nbPolesAjoutes > 0 ? ", " + nbPolesAjoutes + " pôle(s) ajouté(s)" : "") + " traité(s).";
      importError = false;
      logHistorique("import_donnees", importStatus);
      renderDonnees();
    }).catch(function(err){
      importStatus = "Erreur pendant l'import : " + (err && err.message ? err.message : err);
      importError = true;
      renderDonnees();
    });
  }

  // Réinitialisation complète (demande de Jluc) : supprime les données d'une
  // exploitation réelle (bénévoles, missions, inscriptions, candidatures)
  // pour repartir d'une base vide — typiquement après une démonstration
  // faite avec le jeu de données fictif. Ne touche JAMAIS aux comptes
  // Gestionnaire/Directeur (de vrais accès de connexion, voir
  // importerDonnees ci-dessus) ni à la configuration (pôles, statuts).
  // Confirmation par saisie d'un mot exact plutôt qu'un simple confirm() :
  // vu l'ampleur (tout est supprimé d'un coup, contrairement à "Supprimer
  // la mission"/"Supprimer la fiche" qui ne touchent qu'un seul
  // enregistrement), une case à cliquer trop vite ne suffit pas comme
  // protection.
  //
  // L'historique est traité À PART, en "best effort" (essai indépendant,
  // erreur par élément ignorée) : sur la base réelle de Jluc, les règles de
  // sécurité Firestore refusent la suppression des entrées d'historique
  // (erreur "Missing or insufficient permissions" observée le 19/09/2026),
  // très probablement volontaire pour garder un journal d'actions
  // infalsifiable — aucun autre bouton de l'appli ne supprime de
  // l'historique. Le regrouper avec bénévoles/missions/affectations/
  // candidatures dans un seul Promise.all faisait échouer TOUTE la
  // réinitialisation (y compris la partie qui, elle, fonctionne) dès que
  // Firestore refusait ne serait-ce qu'une seule des suppressions
  // d'historique. Désormais, un refus sur l'historique n'empêche plus le
  // reste d'aboutir, et le message final dit précisément ce qui a été fait.
  function reinitialiserApplication(){
    var saisie = prompt(
      "Ceci va supprimer DÉFINITIVEMENT tous les bénévoles, missions, inscriptions "
      + "et candidatures. Les comptes Gestionnaire/Directeur et la configuration "
      + "(pôles, statuts) sont conservés. L'historique des actions sera aussi vidé "
      + "si les règles de sécurité Firestore l'autorisent (sinon il reste tel quel).\n\n"
      + "Pensez à exporter une copie avant si vous voulez pouvoir revenir en arrière "
      + "(bouton \"Exporter horodaté\" ci-dessus).\n\n"
      + "Pour confirmer, tapez SUPPRIMER (en majuscules) :"
    );
    if(saisie === null) return; // Annuler : on ne montre même pas de message, pas une vraie tentative.
    if(saisie.trim() !== "SUPPRIMER"){
      reinitialisationStatus = "Réinitialisation annulée : le texte tapé ne correspondait pas à « SUPPRIMER ».";
      reinitialisationError = true;
      renderDonnees();
      return;
    }

    var nb = {
      benevoles: state.benevoles.length,
      missions: state.missions.length,
      affectations: state.affectations.length,
      candidatures: state.candidatures.length,
      historique: state.historique.length
    };
    var suppressionsPrincipales = [];
    state.benevoles.forEach(function(b){ suppressionsPrincipales.push(deleteDoc(doc(db,"benevoles", b.id))); });
    state.missions.forEach(function(m){ suppressionsPrincipales.push(deleteDoc(doc(db,"missions", m.id))); });
    state.affectations.forEach(function(a){ suppressionsPrincipales.push(deleteDoc(doc(db,"affectations", a.id))); });
    state.candidatures.forEach(function(c){ suppressionsPrincipales.push(deleteDoc(doc(db,"candidatures", c.id))); });

    // Historique : chaque suppression individuelle ignore sa propre erreur
    // (.catch renvoyant false) au lieu de faire échouer tout le reste.
    var nbHistoriqueSupprime = 0;
    var suppressionsHistorique = state.historique.map(function(h){
      return deleteDoc(doc(db,"historique", h.id))
        .then(function(){ nbHistoriqueSupprime++; return true; })
        .catch(function(){ return false; });
    });

    Promise.all(suppressionsPrincipales).then(function(){
      return Promise.all(suppressionsHistorique);
    }).then(function(){
      reinitialisationStatus = "Application réinitialisée : " + nb.benevoles + " bénévole(s), " + nb.missions + " mission(s), "
        + nb.affectations + " inscription(s) et " + nb.candidatures + " candidature(s) supprimées.";
      if(nb.historique === 0){
        reinitialisationStatus += " Aucune entrée d'historique à supprimer.";
      } else if(nbHistoriqueSupprime === nb.historique){
        reinitialisationStatus += " " + nbHistoriqueSupprime + " entrée(s) d'historique supprimée(s).";
      } else if(nbHistoriqueSupprime === 0){
        reinitialisationStatus += " L'historique des actions (" + nb.historique + " entrée(s)) n'a PAS pu être supprimé : "
          + "les règles de sécurité Firestore ne l'autorisent pas (probablement volontaire, pour garder un journal fiable).";
      } else {
        reinitialisationStatus += " " + nbHistoriqueSupprime + " sur " + nb.historique + " entrée(s) d'historique supprimée(s), le reste refusé par les règles de sécurité.";
      }
      reinitialisationError = false;
      // Journalisée après coup (création, jamais bloquée par les mêmes
      // règles que la suppression) : garde une trace de quand et par qui la
      // réinitialisation a été faite, même si l'historique n'a pas pu être
      // vidé lui-même.
      logHistorique("reinitialisation_application", reinitialisationStatus);
      renderDonnees();
    }).catch(function(err){
      reinitialisationStatus = "Erreur pendant la réinitialisation : " + (err && err.message ? err.message : err) + " (une partie a peut-être déjà été supprimée).";
      reinitialisationError = true;
      renderDonnees();
    });
  }

  function reportError(err){
    console.error(err);
    alert("Une erreur est survenue, réessayez dans un instant : " + (err && err.message ? err.message : err));
  }

  // ---------- collections réservées gestionnaires/Directeur ----------
  function attachRoleCollections(){
    if(unsubGestionnaires) return;
    unsubGestionnaires = onSnapshot(collection(db,"gestionnaires"), function(snap){
      state.gestionnaires = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); })
        .sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||""); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
    unsubHistorique = onSnapshot(collection(db,"historique"), function(snap){
      state.historique = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
    unsubCandidatures = onSnapshot(collection(db,"candidatures"), function(snap){
      state.candidatures = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, function(){ /* accès révoqué : silencieux */ });
  }

  function detachRoleCollections(){
    if(unsubGestionnaires){ unsubGestionnaires(); unsubGestionnaires = null; }
    if(unsubHistorique){ unsubHistorique(); unsubHistorique = null; }
    if(unsubCandidatures){ unsubCandidatures(); unsubCandidatures = null; }
    state.gestionnaires = [];
    state.historique = [];
    state.candidatures = [];
  }

  // ---------- Firebase wiring ----------
  onAuthStateChanged(auth, function(user){
    authReady = !!user;
    document.getElementById("status-dot").classList.toggle("ok", authReady);
    document.getElementById("status-text").textContent = authReady ? "Connecté — les données sont partagées en direct." : "Connexion à la base de données…";

    if(authReady){ attachPublicCollections(); }

    if(unsubMoi){ unsubMoi(); unsubMoi = null; }
    detachRoleCollections();
    role = "public"; moiNom = ""; moiUid = null;

    var isPasswordUser = !!(user && user.providerData.some(function(p){ return p.providerId === "password"; }));
    if(user && isPasswordUser){
      moiUid = user.uid;
      unsubMoi = onSnapshot(doc(db,"gestionnaires", user.uid), function(snap){
        if(snap.exists() && snap.data().actif){
          role = snap.data().role === "directeur" ? "directeur" : "gestionnaire";
          moiNom = snap.data().nom || "";
          attachRoleCollections();
          completerNumerosMissions();
        } else {
          role = "public"; moiNom = "";
          detachRoleCollections();
        }
        renderAll();
      }, function(){ role = "public"; moiNom = ""; renderAll(); });
    }

    renderAll();
  });

  signInAnonymously(auth).catch(function(err){
    document.getElementById("status-text").textContent = "Connexion impossible : " + (err && err.message ? err.message : err);
  });

  function sortBenevoles(){ state.benevoles.sort(function(a,b){ return (a.nom||"").localeCompare(b.nom||"") || (a.prenom||"").localeCompare(b.prenom||""); }); }
  function sortMissions(){ state.missions.sort(function(a,b){ return (a.date||"").localeCompare(b.date||"") || (a.debut||"").localeCompare(b.debut||""); }); }

  function maxNumeroMission(){
    var max = 0;
    state.missions.forEach(function(m){ if(m.numero && m.numero > max) max = m.numero; });
    return max;
  }
  function prochainNumeroMission(){
    return maxNumeroMission() + 1;
  }

  // Rattrapage : les missions créées avant l'ajout de cette numérotation n'ont
  // pas de champ "numero". On leur en attribue un une seule fois, à la suite
  // du plus grand numéro déjà utilisé, dans l'ordre de création (date de
  // création si connue, sinon date de la mission) pour rester cohérent avec
  // les missions déjà numérotées. Seuls gestionnaire/directeur ont le droit
  // d'écrire dans Firestore (voir les règles de sécurité) : un visiteur
  // public ne déclenche jamais ce rattrapage. Le verrou "numerotationEnCours"
  // évite de relancer l'opération en boucle tant que les écritures en cours
  // n'ont pas abouti (l'écriture elle-même déclenchera un nouvel appel via
  // onSnapshot, qui ne trouvera alors plus rien à numéroter).
  var numerotationEnCours = false;
  function completerNumerosMissions(){
    if(role === "public" || numerotationEnCours) return;
    var sansNumero = state.missions.filter(function(m){ return !m.numero; });
    if(!sansNumero.length) return;
    numerotationEnCours = true;
    var base = maxNumeroMission();
    sansNumero.sort(function(m1, m2){
      var t1 = m1.creeLe && m1.creeLe.toMillis ? m1.creeLe.toMillis() : 0;
      var t2 = m2.creeLe && m2.creeLe.toMillis ? m2.creeLe.toMillis() : 0;
      if(t1 && t2) return t1 - t2;
      return (m1.date||"").localeCompare(m2.date||"") || (m1.debut||"").localeCompare(m2.debut||"");
    });
    var ecritures = sansNumero.map(function(m, idx){
      return updateDoc(doc(db,"missions", m.id), { numero: base + idx + 1 }).catch(function(){});
    });
    Promise.all(ecritures).then(function(){ numerotationEnCours = false; });
  }

  // Passage automatique en "À vérifier" des missions dont la date est
  // dépassée (demande de Jluc). Ne touche QUE les missions encore au
  // statut "En cours" : une mission déjà mise à "À vérifier", "Terminée"
  // ou "Non effectuée" à la main n'est jamais réécrite — ce mécanisme ne
  // fait qu'accélérer le premier passage, il ne remplace jamais une
  // décision déjà prise par un·e gestionnaire. "Date dépassée" = strictement
  // avant aujourd'hui (une mission du jour même n'est pas encore basculée).
  // Comme pour la numérotation ci-dessus : seuls gestionnaire/Directeur
  // déclenchent ce contrôle (un visiteur public n'a de toute façon pas le
  // droit d'écrire dans Firestore), et le verrou évite de relancer la même
  // écriture en boucle.
  //
  // Limite à connaître : ce contrôle ne s'exécute que quand quelqu'un
  // (gestionnaire ou Directeur) a l'application ouverte dans son
  // navigateur — il n'y a pas de tâche automatique côté serveur dans cette
  // appli (pas de backend, juste ce fichier + Firebase). Si personne ne se
  // connecte pendant plusieurs jours après la date d'une mission, le
  // changement de statut n'a lieu qu'à la prochaine connexion.
  var verificationStatutEnCours = false;
  function verifierMissionsAPasser(){
    if(role === "public" || verificationStatutEnCours) return;
    var aujourdhui = aujourdhuiIso();
    var aBasculer = state.missions.filter(function(m){
      return m.date && m.date < aujourdhui && statutMission(m) === "En cours";
    });
    if(!aBasculer.length) return;
    verificationStatutEnCours = true;
    var ecritures = aBasculer.map(function(m){
      return updateDoc(doc(db,"missions", m.id), { statut: "À vérifier" }).catch(function(){});
    });
    Promise.all(ecritures).then(function(){ verificationStatutEnCours = false; });
  }

  var publicCollectionsAttached = false;
  var unsubBenevoles = null, unsubMissions = null, unsubAffectations = null, unsubParametres = null;

  function attachPublicCollections(){
    // N'ouvrir ces écoutes qu'une fois la connexion (même anonyme) confirmée :
    // sinon, sur un réseau lent, Firestore refuse la lecture le temps que la
    // connexion s'établisse, et une alerte d'erreur apparaît inutilement.
    if(publicCollectionsAttached) return;
    publicCollectionsAttached = true;

    unsubBenevoles = onSnapshot(collection(db,"benevoles"), function(snap){
      state.benevoles = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      sortBenevoles();
      renderAll();
    }, reportError);

    unsubMissions = onSnapshot(collection(db,"missions"), function(snap){
      state.missions = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      sortMissions();
      completerNumerosMissions();
      verifierMissionsAPasser();
      renderAll();
    }, reportError);

    unsubAffectations = onSnapshot(collection(db,"affectations"), function(snap){
      state.affectations = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
      renderAll();
    }, reportError);

    unsubParametres = onSnapshot(doc(db,"parametres","poles"), function(snap){
      state.poles = (snap.exists() && Array.isArray(snap.data().liste) && snap.data().liste.length) ? snap.data().liste : POLES.slice();
      state.statutsMissions = (snap.exists() && Array.isArray(snap.data().statutsMissions) && snap.data().statutsMissions.length)
        ? snap.data().statutsMissions.map(function(s){ return s === "Terminées" ? "Terminée" : s; })
        : STATUTS_MISSIONS.slice();
      renderAll();
    }, function(){ /* pas encore de liste personnalisée : on garde les valeurs par défaut */ });
  }

  function detachPublicCollections(){
    // À appeler juste avant une déconnexion : le court instant sans session
    // (entre la déconnexion et la reconnexion anonyme automatique) ferait
    // sinon échouer ces écoutes déjà ouvertes avec une alerte d'erreur.
    if(unsubBenevoles){ unsubBenevoles(); unsubBenevoles = null; }
    if(unsubMissions){ unsubMissions(); unsubMissions = null; }
    if(unsubAffectations){ unsubAffectations(); unsubAffectations = null; }
    if(unsubParametres){ unsubParametres(); unsubParametres = null; }
    publicCollectionsAttached = false;
  }

  renderAll();
</script>
</body>
</html>
