<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bénévoles Rancy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f8f7f4;
    --surface:#ffffff;
    --surface-2:#f1efe8;
    --ink:#2c2c2a;
    --ink-soft:#5f5e5a;
    --ink-faint:#8f8d85;
    --line:#d3d1c7;
    --accent:#378ade;
    --accent-deep:#27639f;
    --accent-ink:#ffffff;
    --accent-soft:#e6f1fb;
    --accent-soft-ink:#183e63;
    --success:#1d9e75;
    --success-soft:#e1f5ee;
    --success-soft-ink:#085041;
    --warm:#ba7517;
    --warm-soft:#faeeda;
    --warm-soft-ink:#7a5210;
    --danger:#a32d2d;
    --danger-soft:#fcebeb;
    --radius:10px;
    --radius-sm:6px;
    --shadow:0 2px 8px rgba(0,0,0,.08);
    --shadow-sm:0 1px 4px rgba(0,0,0,.06);
  }
  /* Le site garde toujours ce thème clair, même si le téléphone est en mode sombre. */

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;font-size:15px;line-height:1.45;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0;}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  /* Largeur élargie de 920px à 1280px (demande de Jluc, le 920px coupait
     les colonnes des tableaux, ex. "Places"). C'est un max-width, pas une
     largeur fixe : sur un écran plus étroit que 1280px (mobile compris),
     le contenu reste toujours à 100% de l'écran (moins le padding) comme
     avant — rien ne change sur portable. */
  .shell{max-width:1280px;margin:0 auto;padding:0 16px 72px;}

  .hero-wrap{background:var(--accent-deep);color:#fff;}
  .hero-inner{max-width:1280px;margin:0 auto;padding:22px 16px 26px;}
  .eyebrow{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.75);font-weight:700;}
  .title{font-size:clamp(1.5rem,3.4vw,2rem);margin-top:6px;color:#fff;}
  .subtitle{color:rgba(255,255,255,.82);max-width:60ch;margin-top:8px;font-size:.92rem;}

  .status-line{margin-top:14px;font-size:.85rem;color:rgba(255,255,255,.8);display:flex;align-items:center;gap:8px;}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--warm);flex:none;}
  .status-dot.ok{background:var(--success);}

  .admin-row{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:rgba(255,255,255,.92);}
  .link-btn{background:none;border:none;color:var(--accent-deep);font-weight:600;font-size:.85rem;padding:0;text-decoration:underline;}
  .admin-row .link-btn{color:#fff;}
  .admin-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .admin-form input{background:rgba(255,255,255,.95);border:1px solid transparent;border-radius:var(--radius-sm);padding:7px 10px;font-size:.85rem;color:var(--ink);}
  .admin-pill{font-size:.78rem;font-weight:700;color:var(--warm-soft-ink);background:var(--warm-soft);border-radius:999px;padding:4px 10px;}
  .error-text{color:var(--danger);font-size:.82rem;}
  .admin-row .error-text{color:#ffd7ce;}
  .ok-text{color:#dcffe6;font-size:.82rem;}
  .msg-error{color:var(--danger);font-size:.85rem;}
  .msg-ok{color:var(--success-soft-ink);font-size:.85rem;}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);border-left:4px solid var(--accent);}
  .stat-clic{cursor:pointer;}
  .stat-clic:hover,.stat-clic:focus-visible{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);outline:none;}
  .stat-alerte{border-left-color:var(--warm);}
  .stat-alerte .stat-value{color:var(--warm);}
  .mission-a-pointer{background:var(--warm-soft);color:var(--warm-soft-ink);border:1px solid var(--warm);border-radius:8px;padding:6px 10px;font-size:.85rem;font-weight:600;margin:8px 0;}
  .stat-value{font-family:"Fraunces",serif;font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);}
  .stat-label{color:var(--ink-soft);font-size:.82rem;margin-top:2px;}

  .tabs{display:flex;gap:18px;margin-top:26px;border-bottom:1px solid var(--line);overflow-x:auto;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 2px;font-weight:600;color:var(--ink-soft);white-space:nowrap;}
  .tab[aria-selected="true"]{color:var(--accent-deep);border-bottom-color:var(--accent);}

  .panel{padding-top:20px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
  .toolbar h2{font-size:1.25rem;}
  .toolbar-meta{color:var(--ink-soft);font-size:.86rem;}

  .btn{border-radius:var(--radius-sm);padding:9px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;gap:6px;}
  .btn:hover{border-color:var(--ink-faint);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-ghost{background:none;border-color:transparent;color:var(--ink-soft);padding:8px 10px;}
  .admin-row .btn-ghost{color:#fff;}
  .btn-danger-ghost{background:none;border-color:transparent;color:var(--danger);padding:6px 8px;font-size:.82rem;}
  .btn-sm{padding:6px 12px;font-size:.82rem;}

  /* Badges-boutons : "Imprimer la sélection", "Vider la sélection", "Vue cartes/tableau".
     Un fond plein et arrondi (comme .places-badge/.role-pill) pour bien les
     distinguer du texte simple, une couleur par type d'action, la même
     couleur partout où ce bouton apparaît. */
  .btn-badge{border-radius:999px;border-color:transparent;font-weight:700;}
  .badge-imprimer{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .badge-imprimer:hover{background:var(--accent);color:var(--accent-ink);}
  .badge-vider{background:var(--warm-soft);color:var(--warm-soft-ink);}
  .badge-vider:hover{background:var(--warm);color:#fff;}
  .badge-vue{background:var(--success-soft);color:var(--success-soft-ink);}
  .badge-vue:hover{background:var(--success);color:#fff;}

  .form{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field label{font-size:.82rem;font-weight:600;color:var(--ink-soft);}
  .field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 10px;}
  .checkbox-group{display:flex;flex-wrap:wrap;gap:8px;}
  .checkbox-chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.84rem;background:var(--surface);}
  .form-actions{display:flex;gap:10px;margin-top:6px;align-items:center;flex-wrap:wrap;}
  .form-hint{color:var(--ink-faint);font-size:.8rem;}

  /* Modale (ex. formulaire "Créer/Modifier une mission") : par-dessus le
     reste de l'écran, pour ne pas perdre sa place dans le tableau en
     modifiant une ligne (demande de Jluc). */
  .modal-backdrop{position:fixed;inset:0;background:rgba(44,44,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto;z-index:100;}
  /* Modale de gestion de mission : bandeau de titre coloré, plein bord, à
     la manière des modales de gestion de PICS (demande de Jluc) — plus
     agréable qu'un simple titre noir sur fond blanc. */
  .modal-box{background:var(--surface);border-radius:var(--radius);box-shadow:0 16px 48px rgba(0,0,0,.28);max-width:760px;width:100%;margin:auto;overflow:hidden;}
  .modal-box .form{margin:20px 24px 24px;}
  .modal-box-head{display:flex;justify-content:space-between;align-items:center;background:var(--accent-deep);color:#fff;padding:16px 24px;}
  .modal-box-head h3{margin:0;font-family:"Fraunces",Georgia,serif;font-size:1.3rem;}
  .modal-close{background:rgba(255,255,255,.16);border:none;font-size:1.05rem;line-height:1;color:#fff;cursor:pointer;padding:7px 11px;border-radius:999px;}
  .modal-close:hover{background:rgba(255,255,255,.32);color:#fff;}
  /* Champs "colorés" : label en couleur + bordure/fond assortis, pour
     repérer d'un coup d'œil le pôle, le statut... (même esprit que les
     fiches colorées de PICS). --fc / --fc-soft sont fixés en style inline
     par missionChampHtml/missionSelectChampHtml selon le champ. */
  .field.champ-colore label{color:var(--fc);font-weight:700;}
  .field.champ-colore input,.field.champ-colore select,.field.champ-colore textarea{border:2px solid var(--fc);background:var(--fc-soft);}
  .field.champ-colore input:focus,.field.champ-colore select:focus,.field.champ-colore textarea:focus{outline:2px solid var(--fc);outline-offset:1px;}
  /* Section "Inscrits" en bas de la modale : même codes visuels que les
     rubriques "Réunion liée / NC liée / Document lié" de PICS (icône +
     titre en majuscules coloré, séparé par un filet). */
  .modal-section-inscrits{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;}
  .modal-section-titre{font-size:.78rem;font-weight:700;letter-spacing:.03em;color:var(--accent-deep);text-transform:uppercase;margin-bottom:8px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:10px;}

  .benevole-name{font-family:"Fraunces",serif;font-size:1.08rem;font-weight:600;}
  .benevole-contact{color:var(--ink-soft);font-size:.84rem;}
  .mission-creele{color:var(--ink-soft);font-size:.8rem;margin-top:2px;}
  .mission-date-detail{color:var(--ink-soft);font-size:.86rem;margin-top:2px;}
  .badge-inactif{color:var(--danger);font-size:.8rem;}
  .missions-table{table-layout:fixed;}
  .missions-table th:nth-child(1),.missions-table td:nth-child(1){width:4%;}
  .missions-table th:nth-child(2),.missions-table td:nth-child(2){width:22%;}
  .missions-table th:nth-child(3),.missions-table td:nth-child(3){width:20%;}
  .missions-table th:nth-child(4),.missions-table td:nth-child(4){width:11%;}
  .missions-table th:nth-child(5),.missions-table td:nth-child(5){width:17%;}
  .missions-table th:nth-child(6),.missions-table td:nth-child(6){width:15%;}
  .missions-table th:nth-child(7),.missions-table td:nth-child(7){width:11%;}
  .col-select{width:4%;text-align:center;}

  /* Impression des lignes sélectionnées (Bénévoles / Missions) : le
     contenu de #impression est construit en JS juste avant window.print(),
     et n'est affiché que sur papier (voir @media print ci-dessous). Mise en
     page inspirée de PICS : entête avec pictogramme + nom d'appli, trait
     coloré épais, titre de section coloré, tableau resserré, signature
     horodatée en pied de page. Le tout pensé concis : pas de ligne ou de
     tableau vide, une seule couleur d'accent reprise partout. */
  #impression{display:none;}
  #impression .impression-entete{display:flex;justify-content:space-between;align-items:flex-start;}
  #impression .impression-titre-app{font-family:"Fraunces",serif;font-weight:700;font-size:1.5rem;color:var(--accent-deep);}
  /* font-family:initial pour que le pictogramme reste en emoji couleur —
     sans ça, il hérite de la police serif du titre, qui n'a pas de glyphe
     couleur pour les emojis et l'affiche en contour noir et blanc. */
  #impression .impression-titre-app .impression-logo{margin-right:6px;font-family:initial;}
  #impression .impression-soustitre{color:var(--ink-soft);font-size:.82rem;margin-top:2px;}
  #impression .impression-date{font-size:.9rem;color:var(--ink-soft);white-space:nowrap;}
  #impression .impression-trait{height:3px;background:var(--accent-deep);margin:10px 0 18px;border:none;}
  #impression h2{margin:0 0 12px;font-size:1.25rem;font-weight:700;color:var(--accent-deep);}
  #impression table{width:100%;border-collapse:collapse;font-size:.83rem;}
  #impression thead th{background:#f4f2ee;color:var(--ink-faint);text-transform:uppercase;font-size:.68rem;letter-spacing:.03em;text-align:left;padding:7px 10px;border-bottom:2px solid #ddd;}
  #impression tbody td{padding:7px 10px;border-bottom:1px solid #eee;text-align:left;}
  #impression tbody td.impression-col-principale{font-weight:700;color:var(--ink);}
  #impression .impression-alerte{color:var(--danger);font-weight:700;white-space:nowrap;}
  #impression .impression-pied{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px;padding-top:10px;border-top:1px solid #ddd;font-size:.78rem;color:var(--ink-soft);}
  /* Impression de l'historique par bénévole (imprimerHistoriqueBenevoles) :
     un bloc par bénévole, bien séparé du suivant par un trait et un espace,
     et qui évite de couper une fiche en deux entre deux pages. Concision :
     un bénévole sans aucune inscription tient sur une ligne de texte, pas
     un tableau vide (voir imprimerHistoriqueBenevoles). */
  #impression .impression-bloc-benevole{margin-top:18px;padding-top:14px;border-top:1px solid #ddd;page-break-inside:avoid;}
  #impression .impression-bloc-benevole:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  #impression .impression-bloc-benevole h3{margin:0 0 3px;font-size:.95rem;color:var(--ink);}
  #impression .impression-resume{font-size:.82rem;color:var(--ink-soft);margin-bottom:6px;}
  #impression .impression-vide{color:var(--ink-faint);font-style:italic;font-size:.85rem;}
  /* Historique des actions, présenté façon "PICS" en journal chronologique
     (bandeau coloré à gauche) plutôt qu'en tableau — plus lisible qu'une
     grille de colonnes pour une suite d'évènements. */
  #impression .impression-evenement{border-left:3px solid var(--accent); padding:2px 0 10px 12px; margin-bottom:10px; page-break-inside:avoid;}
  #impression .impression-evenement:last-child{margin-bottom:0;}
  #impression .impression-evenement-date{font-size:.75rem;color:var(--ink-faint);}
  #impression .impression-evenement-action{font-weight:700;color:var(--ink);font-size:.92rem;margin:1px 0;}
  #impression .impression-evenement-detail{font-size:.85rem;color:var(--ink-soft);}
  /* Sous-titre de section dans une fiche imprimée (ex. "Historique des
     réalisations" sur la fiche bénévole) — même traitement que le titre
     "Historique des échanges" de PICS : gras, coloré, souligné. */
  #impression h3.impression-sous-titre{margin:22px 0 10px;font-size:1.05rem;font-weight:700;color:var(--accent-deep);padding-bottom:6px;border-bottom:2px solid var(--accent-deep);}
  @media print{
    body{background:#fff;}
    body *{visibility:hidden;}
    #impression,#impression *{visibility:visible;}
    #impression{display:block;position:absolute;top:0;left:0;width:100%;padding:20px 24px;background:#fff;}
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-soft);color:var(--accent-soft-ink);border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:600;}
  .tag .dot{width:7px;height:7px;border-radius:50%;flex:none;}
  .card-footrow{display:flex;justify-content:space-between;align-items:center;margin-top:auto;font-size:.82rem;color:var(--ink-soft);}

  .benevole-missions{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;}
  .benevole-missions-titre{font-weight:600;font-size:.82rem;margin-bottom:2px;}
  .benevole-missions-resume{font-size:.78rem;color:var(--ink-soft);margin-bottom:6px;}
  .benevole-missions-liste{margin:0;padding-left:0;list-style:none;font-size:.84rem;color:var(--ink-soft);max-height:170px;overflow-y:auto;}
  .benevole-missions-liste li{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  /* Badge bleu bien visible (demande de Jluc) : un vrai bouton, pas juste
     un lien discret, pour que ce soit évident qu'on peut cliquer dessus. */
  .badge-voir-mission{display:inline-flex;align-items:center;gap:4px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:3px 11px;font-size:.74rem;font-weight:700;white-space:nowrap;cursor:pointer;flex-shrink:0;}
  .badge-voir-mission:hover,.badge-voir-mission:focus-visible{background:var(--accent-deep);outline:none;}
  .statut-realisee{color:var(--success-soft-ink);font-weight:600;}
  .statut-avenir{color:var(--accent-soft-ink);font-weight:600;}
  .statut-nonrealisee{color:var(--danger);font-weight:600;}

  .mission-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;}
  .mission-title{font-family:"Fraunces",serif;font-size:1.1rem;font-weight:600;}
  .mission-when{color:var(--ink-soft);font-size:.85rem;margin-top:2px;}
  .mission-meta{color:var(--ink-faint);font-size:.78rem;}
  .places-badge{font-variant-numeric:tabular-nums;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink);white-space:nowrap;}
  .mission-id-badge{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink);vertical-align:middle;margin-left:4px;}
  .places-badge.low{background:var(--danger-soft);color:var(--danger);}
  .statut-tag{display:inline-flex;align-items:center;border-radius:999px;padding:4px 10px;font-size:.76rem;font-weight:600;white-space:nowrap;}
  .statut-tag.statut-accent{background:var(--accent-soft);color:var(--accent-soft-ink);}
  .statut-tag.statut-warm{background:var(--warm-soft);color:var(--warm-soft-ink);}
  .statut-tag.statut-success{background:var(--success-soft);color:var(--success-soft-ink);}
  .statut-tag.statut-danger{background:var(--danger-soft);color:var(--danger);}
  .mission-desc{color:var(--ink-soft);font-size:.88rem;}
  /* Note interne (gestionnaires/Directeur uniquement, jamais visible du
     public) — fond distinct de la description pour bien la repérer. */
  .mission-commentaires{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:.85rem;color:var(--ink-soft);margin-top:8px;white-space:pre-wrap;}
  .mission-commentaires strong{color:var(--ink);}

  .inscrits-list{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;}
  .inscrit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.86rem;}
  .inscrit-name{display:flex;align-items:center;gap:8px;}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex:none;}
  .realise-toggle{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--ink-soft);}
  .inscrit-actions{display:flex;align-items:center;gap:8px;}

  .inscrire-row{display:flex;gap:8px;margin-top:2px;}
  .inscrire-row select{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;}

  .heures-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .heures-table th,.heures-table td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;}
  .heures-table th{background:var(--surface-2);color:var(--ink-soft);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;}
  .heures-table td.num{font-variant-numeric:tabular-nums;text-align:right;}
  .heures-table tr:last-child td{border-bottom:none;}
  .th-tri{background:none;border:none;padding:0;margin:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .th-tri:hover{color:var(--accent-deep);}
  .th-tri.active{color:var(--accent-deep);font-weight:700;}
  .th-tri .tri-arrow{font-size:.7em;}
  .bar-wrap{width:100px;height:7px;background:var(--surface-2);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:8px;}
  .bar-fill{height:100%;background:var(--accent);}
  .table-scroll{overflow-x:auto;}
  .mission-row{cursor:pointer;}
  /* Couleur pastel de la ligne selon le statut de la mission, même palette
     que les badges de statut (statutTag) : accent=bleu, warm=orange,
     success=vert, danger=rouge. */
  .mission-row.statut-accent td{background:var(--accent-soft);}
  .mission-row.statut-warm td{background:var(--warm-soft);}
  .mission-row.statut-success td{background:var(--success-soft);}
  .mission-row.statut-danger td{background:var(--danger-soft);}
  .mission-row:hover td{background:var(--surface-2);}
  .mission-row.active td{background:var(--accent-soft);}
  .mission-row .tri-arrow{color:var(--ink-soft);display:inline-block;width:.9em;}
  .mission-row-detail td{padding:14px;background:var(--surface-2);}
  .mission-row-detail .card{border:none;box-shadow:none;padding:0;}

  .list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:8px;}
  .list-row-main{display:flex;flex-direction:column;gap:2px;}
  .list-row-title{font-weight:600;}
  .list-row-meta{color:var(--ink-soft);font-size:.82rem;}
  .role-pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-soft-ink);}
  .role-pill.directeur{background:var(--warm-soft);color:var(--warm-soft-ink);}

  .empty-state{color:var(--ink-faint);font-size:.9rem;padding:30px 10px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}

  .footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:.8rem;}

  [hidden]{display:none !important;}

  /* Cartes plus compactes sur téléphone (demande de Jluc) : marges,
     espacements et tailles de police resserrés pour voir plus de missions
     à l'écran sans faire défiler, sans retirer aucune information — rien
     ne change au-delà de 640px de large (tablette/ordinateur inchangés). */
  @media (max-width: 640px){
    .card-grid{gap:10px;}
    .card{padding:12px;gap:6px;}
    .mission-head{gap:8px;}
    .mission-title{font-size:1rem;}
    .mission-when{font-size:.8rem;margin-top:0;}
    .mission-desc{font-size:.84rem;}
    .tags{gap:4px;}
    .tag,.places-badge{padding:3px 8px;font-size:.72rem;}
    .mission-commentaires{padding:6px 8px;margin-top:4px;}
    .inscrits-list{gap:4px;padding-top:8px;}
    .inscrit-row{font-size:.82rem;}
    .avatar{width:22px;height:22px;font-size:.65rem;}
    .inscrire-row{margin-top:0;}
    .card-footrow{font-size:.8rem;}
  }
</style>
</head>
<body>

<div class="hero-wrap">
  <div class="hero-inner">
    <div class="eyebrow">Maison Pour Tous des Rancy</div>
    <h1 class="title">Bénévoles &amp; missions</h1>

    <div class="status-line"><span class="status-dot" id="status-dot"></span><span id="status-text">Connexion à la base de données…</span></div>

    <div class="admin-row" id="admin-row"></div>
  </div>
</div>

<div class="shell">
  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist" aria-label="Sections">
    <button class="tab" role="tab" data-tab="benevoles" aria-selected="false">Bénévoles</button>
    <button class="tab" role="tab" data-tab="missions" aria-selected="true">Missions</button>
    <button class="tab" role="tab" data-tab="historique" aria-selected="false" hidden>Historique</button>
    <button class="tab" role="tab" data-tab="equipe" aria-selected="false" hidden>Équipe</button>
    <button class="tab" role="tab" data-tab="candidatures" aria-selected="false" hidden>Candidatures</button>
    <button class="tab" role="tab" data-tab="parametres" aria-selected="false" hidden>Paramètres</button>
    <button class="tab" role="tab" data-tab="donnees" aria-selected="false" hidden>Données</button>

  <section class="panel" id="panel-missions" role="tabpanel"></section>
  <section class="panel" id="panel-historique" role="tabpanel" hidden></section>
  <section class="panel" id="panel-equipe" role="tabpanel" hidden></section>
  <section class="panel" id="panel-candidatures" role="tabpanel" hidden></section>
  <section class="panel" id="panel-parametres" role="tabpanel" hidden></section>
  <section class="panel" id="panel-donnees" role="tabpanel" hidden></section>

  <div class="footer">Maison Pour Tous des Rancy — gestion des bénévoles.</div>
</div>

<div id="impression"></div>

<!-- Racine des modales "mission" (voir / modifier), en dehors des onglets
     (panel-*) : elles doivent pouvoir s'afficher par-dessus n'importe quel
     onglet (ex. depuis la fiche d'un bénévole, sans quitter l'onglet
     Bénévoles), donc pas question de les mettre dans un panel qui peut
     être "hidden". Voir renderModal(). -->
<div id="modal-root"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth, signInAnonymously, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    sendPasswordResetEmail, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getFirestore, collection, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, doc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBSyVjgKuvlbmY87m9w8UyCQuaTIVZrZ0A",
    authDomain: "benevoles-rancy.firebaseapp.com",
    projectId: "benevoles-rancy",
    storageBucket: "benevoles-rancy.firebasestorage.app",
    messagingSenderId: "553595557970",
    appId: "1:553595557970:web:2be7c210ba7383811ea78b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Seconde instance Firebase utilisée uniquement pour que le Directeur puisse
  // créer un compte "gestionnaire" sans être déconnecté de sa propre session.
  const secondaryApp = initializeApp(firebaseConfig, "secondary");
  const secondaryAuth = getAuth(secondaryApp);

  var POLES = ["Accueil","Ateliers","Numérique (EPN)","Événements","Communication","Logistique"];
  var POLE_HUES = {"Accueil":150,"Ateliers":28,"Numérique (EPN)":205,"Événements":340,"Communication":260,"Logistique":45};
  // Cycle de vie d'une mission, décidé par Jluc : le premier statut de la
  // liste est celui donné par défaut à toute nouvelle mission. Modifiable
  // dans Paramètres, comme les pôles. "Non effectuée" est mis à la main par
  // le/la gestionnaire (jamais automatiquement) une fois qu'il/elle a
  // vérifié qu'une mission "À vérifier" n'a en fait pas eu lieu.
  var STATUTS_MISSIONS = ["En cours","À vérifier","Terminée","Non effectuée"];
  var STATUT_COULEUR = {"En cours":"accent","À vérifier":"warm","Terminée":"success","Non effectuée":"danger"};

  var state = { benevoles: [], missions: [], affectations: [], gestionnaires: [], historique: [], candidatures: [], poles: POLES.slice(), statutsMissions: STATUTS_MISSIONS.slice() };
  var currentTab = "missions";
  var authReady = false;
  var importStatus = "";
  var importError = false;
  var reinitialisationStatus = "";
  var reinitialisationError = false;

  // role: "public" | "gestionnaire" | "directeur"
  var role = "public";
  var moiNom = "";
  var moiUid = null;

  // Identité mémorisée du bénévole sur cet appareil (simple confort, pas une
  // vraie authentification : ça évite qu'on inscrive quelqu'un d'autre par
  // erreur ou par curiosité, sans exiger de compte pour chaque bénévole).
  function chargerMoiBenevoleId(){
    try{ return localStorage.getItem("benevoles-rancy-moi") || null; }catch(e){ return null; }
  }
  function sauvegarderMoiBenevoleId(id){
    try{
      if(id){ localStorage.setItem("benevoles-rancy-moi", id); }
      else { localStorage.removeItem("benevoles-rancy-moi"); }
    }catch(e){ /* stockage indisponible (navigation privée…) : tant pis */ }
  }
  var moiBenevoleId = chargerMoiBenevoleId();
  var identiteError = "";
  // Formulaire d'identification replié par défaut (demande de Jluc, pour
  // gagner de la place sur téléphone) : même principe que candidatureFormOpen
  // ci-dessous — un simple bandeau au départ, le formulaire à 3 champs ne
  // s'affiche qu'au clic sur "Je m'identifie".
  var identiteFormOpen = false;

  // Fenêtre "Mon historique" (demande de Jluc) : accessible une fois
  // identifié, en lecture seule — voir monHistoriqueModaleHtml().
  var monHistoriqueOpen = false;

  var unsubMoi = null;
  var unsubGestionnaires = null;
  var unsubHistorique = null;
  var unsubCandidatures = null;

  var loginFormOpen = false;
  var loginError = "";
  var loginInfo = "";

  var gestionnaireFormOpen = false;
  var gestionnaireError = "";

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    try{
      var d = new Date(iso + "T00:00:00");
      var s = d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
      return s.charAt(0).toUpperCase() + s.slice(1);
    }catch(e){ return iso; }
  }

  // Format court JJ/MM/AAAA : utilisé là où la date complète en toutes
  // lettres ("Dimanche 20 septembre 2026") ne tient pas sur une ligne,
  // par exemple dans une colonne de tableau.
  function fmtDateCourt(iso){
    try{
      var d = new Date(iso + "T00:00:00");
      return d.toLocaleDateString("fr-FR", {day:"2-digit", month:"2-digit", year:"numeric"});
    }catch(e){ return iso; }
  }

  function fmtDateTime(ts){
    try{
      if(!ts || !ts.toDate) return "";
      return ts.toDate().toLocaleDateString("fr-FR") + " à " + ts.toDate().toLocaleTimeString("fr-FR", {hour:"2-digit", minute:"2-digit"});
    }catch(e){ return ""; }
  }

  function dureeHeures(mission){
    var a = mission.debut.split(":").map(Number);
    var b = mission.fin.split(":").map(Number);
    var d = (b[0]+b[1]/60) - (a[0]+a[1]/60);
    if(d < 0) d += 24;
    return Math.round(d*10)/10;
  }

  // Même calcul que dureeHeures, mais à partir de deux chaînes "HH:MM"
  // brutes (utilisé dans la modale mission pour l'affichage en direct,
  // avant même que la mission soit enregistrée) — renvoie "–" tant que les
  // deux heures ne sont pas encore renseignées.
  function calculDureeAffichage(debut, fin){
    if(!debut || !fin) return "–";
    return dureeHeures({debut:debut, fin:fin}) + " h";
  }

  function inscritsDe(missionId){
    return state.affectations.filter(function(a){ return a.missionId === missionId; });
  }

  function placesRestantes(mission){
    return mission.placesTotal - inscritsDe(mission.id).length;
  }

  // Une mission est "passée" dès que son heure de fin est dépassée (demande
  // de Jluc, page de garde publique) : comparaison sur la date + l'heure de
  // fin exactes, pas seulement sur le jour — contrairement à
  // verifierMissionsAPasser() plus bas, qui ne bascule le statut en "À
  // vérifier" qu'au jour près et laisse la mission du jour même "En cours"
  // jusqu'au soir. N'affecte que l'affichage, jamais les données enregistrées.
  function missionEstPassee(mission){
    if(!mission || !mission.date || !mission.fin) return false;
    var finMs = new Date(mission.date + "T" + mission.fin + ":00").getTime();
    if(isNaN(finMs)) return false;
    return finMs < Date.now();
  }

  // Pastille "places" partagée par la fiche mission et le tableau : montre
  // toujours le nombre d'inscrits ET le nombre de places prévues au
  // départ (ex. "1 / 2 places"), pas seulement ce qu'il reste — c'est ce
  // qui manquait dans le tableau (demande de Jluc).
  function placesBadgeHtml(mission){
    var nbInscrits = inscritsDe(mission.id).length;
    var restantes = placesRestantes(mission);
    var cls = "places-badge" + (restantes <= 0 ? " low" : "");
    return '<span class="'+cls+'">'+nbInscrits+' / '+mission.placesTotal+' places</span>';
  }

  // Statut d'une mission ("En cours" / "À vérifier" / "Terminée" /
  // "Non effectuée" par défaut, personnalisable dans Paramètres) : modifié
  // à la main par le/la gestionnaire, SAUF le passage automatique
  // "En cours" → "À vérifier" une fois la date dépassée (voir
  // verifierMissionsAPasser plus bas) — "Non effectuée" reste, lui,
  // toujours un choix manuel après vérification. Une mission créée avant
  // l'ajout de cette fonctionnalité n'a pas encore de champ "statut" en
  // base : on lui affiche alors le premier statut de la liste, sans jamais
  // réécrire la mission elle-même (aucune migration silencieuse en base).
  function statutMission(m){
    var s = (m && m.statut) || state.statutsMissions[0] || "En cours";
    // "Terminées" (ancien libellé, au pluriel) est réaffiché "Terminée" : les
    // missions déjà enregistrées en base avec l'ancien texte ne sont jamais
    // réécrites (aucune migration silencieuse), seul l'affichage est corrigé.
    return s === "Terminées" ? "Terminée" : s;
  }
  function statutTag(statut){
    var couleur = STATUT_COULEUR[statut] || "accent";
    return '<span class="statut-tag statut-'+couleur+'">'+escapeHtml(statut)+'</span>';
  }
  function aujourdhuiIso(){ return new Date().toISOString().slice(0,10); }

  function benevoleById(id){
    return state.benevoles.find(function(b){ return b.id === id; });
  }

  function missionById(id){
    return state.missions.find(function(m){ return m.id === id; });
  }

  // Numéro de référence d'une mission (M1, M2…), attribué une fois pour
  // toutes à la création (voir prochainNumeroMission / completerNumerosMissions
  // plus bas) et affiché partout où le titre de la mission apparaît, pour
  // pouvoir s'y référer facilement même quand plusieurs missions ont lieu le
  // même jour. Une mission qui n'aurait pas encore de numéro (juste après le
  // déploiement de cette fonctionnalité, avant qu'un gestionnaire se
  // connecte) affiche simplement son titre seul.
  function libelleMission(m){
    if(!m) return "";
    return (m.numero ? ("M"+m.numero+" — ") : "") + (m.titre || "");
  }

  function initiales(b){
    return ((b.prenom[0]||"") + (b.nom[0]||"")).toUpperCase();
  }

  function hueForPole(pole){
    if(POLE_HUES[pole] != null) return POLE_HUES[pole];
    var hash = 0;
    for(var i=0; i<pole.length; i++){ hash = (hash * 31 + pole.charCodeAt(i)) % 360; }
    return hash < 0 ? hash + 360 : hash;
  }

  function poleTag(pole){
    var hue = hueForPole(pole);
    return '<span class="tag"><span class="dot" style="background:hsl('+hue+',55%,45%)"></span>'+escapeHtml(pole)+'</span>';
  }

  // Liste déroulante de filtrage par pôle, construite à partir de la liste
  // des pôles définie dans Paramètres (state.poles) — utilisée à l'identique
  // dans Bénévoles et Missions pour rester cohérent.
  function selectFiltrePoleHtml(id, valeurActuelle){
    return '<div class="field" style="max-width:220px;margin-bottom:14px;"><label for="'+id+'">Filtrer par pôle</label>'
      + '<select id="'+id+'"><option value="">Tous les pôles</option>'
      + state.poles.map(function(p){ return '<option value="'+escapeHtml(p)+'"'+(p===valeurActuelle?' selected':'')+'>'+escapeHtml(p)+'</option>'; }).join("")
      + '</select></div>';
  }

  // Même principe pour le statut des missions (voir statutsMissions dans
  // Paramètres) — utilisé uniquement dans l'onglet Missions (le statut n'a
  // pas de sens pour les bénévoles ou les heures données).
  function selectFiltreStatutHtml(id, valeurActuelle){
    return '<div class="field" style="max-width:220px;margin-bottom:14px;"><label for="'+id+'">Filtrer par statut</label>'
      + '<select id="'+id+'"><option value="">Tous les statuts</option>'
      + state.statutsMissions.map(function(s){ return '<option value="'+escapeHtml(s)+'"'+(s===valeurActuelle?' selected':'')+'>'+escapeHtml(s)+'</option>'; }).join("")
      + '</select></div>';
  }

  // Filtre "État" des bénévoles (Actifs / Inactifs) — utilisé dans l'onglet
  // Bénévoles, et par la tuile "Bénévoles actifs" du tableau de bord.
  function selectFiltreEtatBenevoleHtml(id, valeurActuelle){
    return '<div class="field" style="max-width:190px;margin-bottom:14px;"><label for="'+id+'">Filtrer par état</label>'
      + '<select id="'+id+'"><option value="">Tous</option>'
      + '<option value="actif"'+(valeurActuelle==="actif"?' selected':'')+'>Actifs seulement</option>'
      + '<option value="inactif"'+(valeurActuelle==="inactif"?' selected':'')+'>Inactifs seulement</option>'
      + '</select></div>';
  }

  // Filtre "Disponibilité" des missions (places restantes ou non) — utilisé
  // dans l'onglet Missions, et par les tuiles "Missions proposées
  // incomplètes" et "Places disponibles" du tableau de bord.
  function selectFiltreDispoMissionHtml(id, valeurActuelle){
    return '<div class="field" style="max-width:210px;margin-bottom:14px;"><label for="'+id+'">Filtrer par disponibilité</label>'
      + '<select id="'+id+'"><option value="">Toutes</option>'
      + '<option value="incomplete"'+(valeurActuelle==="incomplete"?' selected':'')+'>Incomplètes (places libres)</option>'
      + '<option value="complete"'+(valeurActuelle==="complete"?' selected':'')+'>Complètes</option>'
      + '</select></div>';
  }

  // Bouton "Supprimer tous les filtres", identique dans les onglets qui
  // ont de la recherche/des filtres (Bénévoles, Missions). Grisé quand rien
  // n'est filtré, pour ne pas laisser croire qu'il y a quelque chose à
  // réinitialiser.
  function btnSupprimerFiltres(action, actif){
    return '<button type="button" class="btn btn-ghost btn-sm" data-action="'+action+'" style="align-self:flex-end;margin-bottom:14px;" '+(actif?'':'disabled')+'>Supprimer tous les filtres</button>';
  }

  function heuresParBenevole(){
    var map = {};
    state.benevoles.forEach(function(b){ map[b.id] = 0; });
    state.affectations.forEach(function(a){
      if(a.statut === "realise"){
        var m = missionById(a.missionId);
        if(m && map[a.benevoleId] != null) map[a.benevoleId] += dureeHeures(m);
      }
    });
    return map;
  }

  // Historique complet des inscriptions d'un bénévole — pas seulement les
  // missions réalisées : aussi celles à venir, et surtout celles où il/elle
  // était inscrit·e à une mission déjà passée sans que ce soit jamais marqué
  // "réalisé". C'est ce dernier cas qui permet de juger la fiabilité d'un
  // bénévole (inscriptions sans suite). Le plus récent en premier. Utilisée
  // à la fois pour l'affichage à l'écran (benevoleCardHtml) et pour
  // l'impression (imprimerHistoriqueBenevoles).
  var LIBELLE_STATUT_INSCRIPTION = {realisee:"Réalisée", avenir:"À venir", nonrealisee:"Non réalisée"};
  var CLASSE_STATUT_INSCRIPTION = {realisee:"statut-realisee", avenir:"statut-avenir", nonrealisee:"statut-nonrealisee"};
  function inscriptionsDe(benevoleId){
    var aujourdhuiIso = new Date().toISOString().slice(0,10);
    return state.affectations
      .filter(function(a){ return a.benevoleId === benevoleId; })
      .map(function(a){
        var m = missionById(a.missionId);
        if(!m) return null;
        var statut;
        if(a.statut === "realise") statut = "realisee";
        else if(m.date && m.date >= aujourdhuiIso) statut = "avenir";
        else statut = "nonrealisee";
        return {mission: m, statut: statut};
      })
      .filter(function(x){ return !!x; })
      .sort(function(x1, x2){ return (x2.mission.date||"").localeCompare(x1.mission.date||""); });
  }

  // Même principe qu'inscriptionsDe(), mais côté mission : pour une mission
  // donnée, la liste de ses bénévoles inscrits avec leur statut (réalisée /
  // à venir / non réalisée), triée par Nom — utilisée pour la fiche mission
  // imprimable (voir imprimerFicheMission).
  function inscritsAvecStatutDe(missionId){
    var m = missionById(missionId);
    var aujourdhuiIso = new Date().toISOString().slice(0,10);
    return state.affectations
      .filter(function(a){ return a.missionId === missionId; })
      .map(function(a){
        var b = benevoleById(a.benevoleId);
        if(!b) return null;
        var statut;
        if(a.statut === "realise") statut = "realisee";
        else if(m && m.date && m.date >= aujourdhuiIso) statut = "avenir";
        else statut = "nonrealisee";
        return {benevole: b, statut: statut};
      })
      .filter(function(x){ return !!x; })
      .sort(function(x1, x2){
        return (x1.benevole.nom||"").localeCompare(x2.benevole.nom||"", "fr", {sensitivity:"base"})
          || (x1.benevole.prenom||"").localeCompare(x2.benevole.prenom||"", "fr", {sensitivity:"base"});
      });
  }

  function logHistorique(action, cible){
    addDoc(collection(db,"historique"), {
      action: action, cible: cible, parNom: moiNom, parRole: role, date: serverTimestamp()
    }).catch(function(e){ console.error("historique:", e); });
  }

  // Filet de sécurité léger : trace dans l'historique les inscriptions faites
  // par un visiteur public (non connecté par mot de passe), pour qu'un
  // gestionnaire puisse repérer après coup une inscription suspecte. Le nom
  // enregistré est celui déclaré par le visiteur lui-même (identification
  // prénom/nom/email) — ce n'est qu'une trace de consultation, pas une preuve
  // d'identité : ça n'empêche pas une inscription frauduleuse faite en
  // contournant complètement le site.
  function logHistoriquePublic(action, cible, nomDeclare){
    addDoc(collection(db,"historique"), {
      action: action, cible: cible, parNom: nomDeclare || "Visiteur non identifié", parRole: "public", date: serverTimestamp()
    }).catch(function(e){ console.error("historique:", e); });
  }

  // ---------- render: connexion / mode gestion ----------
  function renderAdminRow(){
    var el = document.getElementById("admin-row");
    if(role !== "public"){
      var pillCls = role === "directeur" ? "admin-pill" : "admin-pill";
      el.innerHTML = '<span class="'+pillCls+'">Connecté : '+escapeHtml(moiNom)+' ('+(role==="directeur"?"Directeur":"Gestionnaire")+')</span>'
        + '<button class="link-btn" data-action="logout">Se déconnecter</button>';
      return;
    }
    if(!loginFormOpen){
      el.innerHTML = '<button class="link-btn" data-action="open-login">Connexion gestionnaire / Directeur</button>';
      return;
    }
    el.innerHTML = '<form class="admin-form" id="form-login">'
      + '<input type="email" name="email" placeholder="Email" autocomplete="username" required>'
      + '<input type="password" name="code" placeholder="Code secret" autocomplete="current-password" required>'
      + '<button type="submit" class="btn btn-sm">Se connecter</button>'
      + '<button type="button" class="btn btn-ghost btn-sm" data-action="cancel-login">Annuler</button>'
      + '<button type="button" class="link-btn" data-action="mdp-oublie">Code oublié ?</button>'
      + (loginError ? '<span class="error-text">'+escapeHtml(loginError)+'</span>' : '')
      + (loginInfo ? '<span class="ok-text">'+escapeHtml(loginInfo)+'</span>' : '')
      + '</form>';
  }

  // ---------- render: stats ----------
  function renderStats(){
    var actifs = state.benevoles.filter(function(b){ return b.actif; }).length;
    var aVenir = state.missions.filter(function(m){ return placesRestantes(m) > 0; }).length;
    var places = state.missions.reduce(function(s,m){ return s + Math.max(0, placesRestantes(m)); }, 0);
    var heuresMap = heuresParBenevole();
    var totalHeures = Object.keys(heuresMap).reduce(function(s,k){ return s + heuresMap[k]; }, 0);
    var aVerifier = state.missions.filter(function(m){ return statutMission(m) === "À vérifier"; }).length;

    // Page de garde publique uniquement : une mission dont l'heure de fin
    // est dépassée n'est plus proposée (demande de Jluc, voir aussi
    // missionsAffichees dans renderMissions()) — ces deux compteurs restent
    // donc cohérents avec la liste affichée juste en dessous, sur la même
    // page de garde. Gestionnaire/Directeur gardent aVenir/places tels
    // quels (calculés plus haut), sans ce filtre : voir toutes les missions
    // incomplètes, même passées, les aide à repérer celles jamais closes.
    var missionsNonPasseesPublic = state.missions.filter(function(m){ return !missionEstPassee(m); });
    var aVenirPublic = missionsNonPasseesPublic.filter(function(m){ return placesRestantes(m) > 0; }).length;
    var placesPublic = missionsNonPasseesPublic.reduce(function(s,m){ return s + Math.max(0, placesRestantes(m)); }, 0);

    // Chaque tuile, pour Gestionnaire/Directeur, ouvre le tableau qu'elle
    // annonce (onglet + filtre/tri déjà en place), comme pour les actions
    // dans PICS. Sans intérêt pour le public : son onglet Bénévoles ne lui
    // est de toute façon pas accessible (voir updateTabsVisibility). La
    // tuile "Heures données" ouvre l'onglet Bénévoles trié par heures.
    //
    // Page de garde (visiteur public, demande de Jluc) : "Bénévoles actifs"
    // et "Heures données" sont retirées, ce sont des chiffres internes sans
    // repère pour quelqu'un qui découvre l'appli. Ne restent que "Missions
    // proposées incomplètes" et "Places disponibles", qui donnent tout de
    // suite l'envie de descendre voir la liste des missions. Gestionnaire et
    // Directeur gardent les 4 tuiles, inchangées.
    var tuiles = role === "public"
      ? [
          stat(aVenirPublic, "Missions proposées incomplètes", false, "incomplet"),
          stat(placesPublic, "Places disponibles", false, "places")
        ]
      : [
          stat(actifs, "Bénévoles actifs", false, "actifs"),
          stat(aVenir, "Missions proposées incomplètes", false, "incomplet"),
          stat(places, "Places disponibles", false, "places"),
          stat((Math.round(totalHeures*10)/10) + " h", "Heures données", false, "heures")
        ];
    // Tuile "Missions à vérifier" : réservé à Gestionnaire/Directeur (c'est
    // une tâche à faire de leur côté, sans intérêt pour le public), et
    // affichée seulement s'il y en a au moins une. Basée sur le statut
    // choisi à la main (onglet Missions / Paramètres) — si le statut
    // "À vérifier" est renommé ou supprimé dans Paramètres, cette tuile ne
    // comptera plus rien : elle est volontairement liée à ce libellé précis.
    if(role !== "public" && aVerifier > 0){
      tuiles.push(stat(aVerifier, "Mission" + (aVerifier>1?"s":"") + " à vérifier", true, "averifier"));
    }
    document.getElementById("stats").innerHTML = tuiles.join("");

    function stat(v,l,alerte,statKey){
      var cliquable = role !== "public" && statKey;
      return '<div class="stat'+(alerte?" stat-alerte":"")+(cliquable?" stat-clic":"")+'"'
        + (cliquable ? ' data-action="ouvrir-stat" data-stat="'+statKey+'" tabindex="0" role="button"' : '')
        + '><div class="stat-value">'+v+'</div><div class="stat-label">'+l+'</div></div>';
    }
  }

  // ---------- render: bénévoles ----------
  var benevoleFormOpen = false;
  var benevoleError = "";
  var benevolesRecherche = "";
  var benevolesFiltrePole = "";
  var benevolesFiltreEtat = ""; // "" | "actif" | "inactif"
  // Même fonctionnement que l'onglet Missions : bascule Vue cartes / Vue
  // tableau (ouverture par défaut sur le tableau), tri par colonne, ligne
  // dépliable pour voir la fiche complète.
  var benevolesVue = "tableau"; // "cartes" | "tableau"
  var benevolesTri = "nom";
  var benevolesSelection = {}; // { [benevoleId]: true } — cases cochées pour l'impression

  // Remet à zéro recherche, filtres et sélection de l'onglet Bénévoles (mais
  // pas le tri) — utilisée par le bouton "Supprimer tous les filtres" ET par
  // les tuiles du tableau de bord (voir "ouvrir-stat") : sans ça, un filtre
  // ou une case cochée laissés par une visite précédente de l'onglet se
  // combinaient avec celui de la tuile cliquée, et la tuile suivante ne
  // montrait plus les bonnes lignes (signalé par Jluc).
  function resetFiltresBenevoles(){
    benevolesRecherche = ""; benevolesFiltrePole = ""; benevolesFiltreEtat = "";
    benevolesSelection = {};
  }

  // Modale de fiche bénévole (voir/modifier), même principe que la modale
  // mission : ouverture directe au clic sur la ligne, champs modifiables
  // (sauf email, qui est l'identifiant Firestore de la fiche).
  var benevoleModaleOpen = false;
  var benevoleModaleId = null;
  var benevoleModaleError = "";

  // Historique des inscriptions d'un bénévole (liste + badge "Voir la
  // mission" pour ouvrir la modale mission par-dessus) — fonction partagée
  // entre la vue "cartes" (benevoleCardHtml), la modale fiche bénévole
  // (benevoleModaleHtml) et la fenêtre "Mon historique" côté public
  // (monHistoriqueModaleHtml), comme missionInscritsSectionHtml() pour les
  // missions. sansLienMission (demande de Jluc) : masque le badge "Voir la
  // mission", qui ouvrirait sinon la modale d'édition de mission — réservée
  // aux Gestionnaires/Directeur, elle n'a rien à faire devant un visiteur
  // public identifié.
  function benevoleHistoriqueSectionHtml(b, sansLienMission){
    var inscriptions = inscriptionsDe(b.id);
    if(!inscriptions.length) return "";

    var nbRealisees = inscriptions.filter(function(x){ return x.statut === "realisee"; }).length;
    var nbAvenir = inscriptions.filter(function(x){ return x.statut === "avenir"; }).length;
    var nbNonRealisees = inscriptions.filter(function(x){ return x.statut === "nonrealisee"; }).length;

    return '<div class="benevole-missions"><div class="benevole-missions-titre">Historique des inscriptions ('+inscriptions.length+')</div>'
      + '<div class="benevole-missions-resume">'+nbRealisees+' réalisée(s) · '+nbAvenir+' à venir · '
        + '<span class="'+(nbNonRealisees>0?"statut-nonrealisee":"")+'">'+nbNonRealisees+' non réalisée(s)</span></div>'
      + '<ul class="benevole-missions-liste">'
      + inscriptions.map(function(x){
          var detail = x.statut === "realisee" ? (" · "+dureeHeures(x.mission)+" h") : "";
          return '<li><span>'+fmtDateCourt(x.mission.date)+' — '+escapeHtml(libelleMission(x.mission))
            + ' <span class="'+CLASSE_STATUT_INSCRIPTION[x.statut]+'">('+LIBELLE_STATUT_INSCRIPTION[x.statut]+detail+')</span></span>'
            + (sansLienMission ? '' : ' <button type="button" class="badge-voir-mission" data-action="edit-mission" data-id="'+x.mission.id+'" title="Voir / modifier cette mission">Voir la mission ↗</button>')+'</li>';
        }).join("")
      + '</ul></div>';
  }

  // Contenu détaillé d'une fiche bénévole (carte), utilisé dans la vue
  // "cartes" — comme missionCardHtml() pour les missions. Le bouton
  // "Modifier" ouvre la modale (voir benevoleModaleHtml).
  function benevoleCardHtml(b, heuresMap){
    var tags = (b.poles||[]).map(poleTag).join("");
    var h = Math.round((heuresMap[b.id]||0)*10)/10;
    var actions = "";
    if(role !== "public"){
      actions += '<button class="btn btn-ghost btn-sm" data-action="open-benevole-modale" data-id="'+b.id+'">Modifier</button>';
      actions += '<button class="btn btn-ghost btn-sm" data-action="toggle-actif" data-id="'+b.id+'">'+(b.actif ? "Marquer inactif" : "Marquer actif")+'</button>';
    }
    if(role !== "public"){
      actions += '<button class="btn-danger-ghost" data-action="delete-benevole" data-id="'+b.id+'" title="Supprimer">✕</button>';
    }

    return '<div class="card">'
      + '<div><div class="benevole-name">'+escapeHtml(b.prenom)+' '+escapeHtml(b.nom)+'</div>'
      + '<div class="benevole-contact">'+escapeHtml(b.email)+'<br>'+escapeHtml(b.tel)+'</div></div>'
      + '<div class="tags">'+(tags || '<span class="benevole-contact">Aucun pôle renseigné</span>')+'</div>'
      + '<div class="card-footrow"><span><strong>'+h+' h</strong> données au total</span>'
      + (actions ? '<span style="display:flex;gap:6px;">'+actions+'</span>' : '')
      + '</div>'
      + benevoleHistoriqueSectionHtml(b)
      + (b.dateCreation ? '<div class="benevole-contact">Fiche créée le '+fmtDateTime(b.dateCreation)+'</div>' : '')
      + (b.actif ? '' : '<div class="benevole-contact" style="color:var(--danger)">Inactif</div>')
      + '</div>';
  }

  // Formulaire public de candidature (envoyé pour validation, ne crée pas
  // directement de fiche bénévole — voir renderCandidatures()).
  var candidatureFormOpen = false;
  var candidatureError = "";
  var candidatureEnvoyee = false;

  function renderBenevoles(){
    var heuresMap = heuresParBenevole();
    // Nombre de missions réalisées (affectations marquées "réalisé") par
    // bénévole — même calcul que l'ancien onglet "Heures données", repris
    // ici pour la colonne "Missions réalisées" du tableau (demande de Jluc,
    // qui a supprimé cet onglet devenu redondant avec Bénévoles).
    var missionsMap = {};
    state.affectations.forEach(function(a){
      if(a.statut === "realise") missionsMap[a.benevoleId] = (missionsMap[a.benevoleId]||0) + 1;
    });
    var recherche = benevolesRecherche.trim().toLowerCase();

    // Recherche générale : nom, prénom, email, téléphone ou pôle. Filtre en
    // plus, si choisi, par un pôle précis (liste déroulante basée sur les
    // pôles définis dans Paramètres).
    var listeFiltree = state.benevoles.filter(function(b){
      if(benevolesFiltrePole && (b.poles||[]).indexOf(benevolesFiltrePole) === -1) return false;
      if(benevolesFiltreEtat === "actif" && !b.actif) return false;
      if(benevolesFiltreEtat === "inactif" && b.actif) return false;
      if(!recherche) return true;
      var poles = (b.poles||[]).join(" ").toLowerCase();
      return (b.nom||"").toLowerCase().indexOf(recherche) >= 0
        || (b.prenom||"").toLowerCase().indexOf(recherche) >= 0
        || (b.email||"").toLowerCase().indexOf(recherche) >= 0
        || (b.tel||"").toLowerCase().indexOf(recherche) >= 0
        || poles.indexOf(recherche) >= 0;
    });

    // Tri : par défaut Nom (ordre alphabétique), comme avant. Les autres
    // tris sont accessibles depuis les en-têtes de colonne de la vue
    // tableau, exactement comme pour Missions.
    listeFiltree.sort(function(a,b){
      if(benevolesTri === "prenom"){
        var cmpP = (a.prenom||"").localeCompare(b.prenom||"", "fr", {sensitivity:"base"});
        if(cmpP !== 0) return cmpP;
      } else if(benevolesTri === "poles"){
        var pa = (a.poles||[]).join(", "), pb = (b.poles||[]).join(", ");
        var cmpPo = pa.localeCompare(pb, "fr", {sensitivity:"base"});
        if(cmpPo !== 0) return cmpPo;
      } else if(benevolesTri === "missions"){
        var cmpM = (missionsMap[b.id]||0) - (missionsMap[a.id]||0);
        if(cmpM !== 0) return cmpM;
      } else if(benevolesTri === "heures"){
        var cmpH = (heuresMap[b.id]||0) - (heuresMap[a.id]||0);
        if(cmpH !== 0) return cmpH;
      }
      return (a.nom||"").localeCompare(b.nom||"", "fr", {sensitivity:"base"})
        || (a.prenom||"").localeCompare(b.prenom||"", "fr", {sensitivity:"base"});
    });

    var cards = listeFiltree.map(function(b){ return benevoleCardHtml(b, heuresMap); }).join("");

    // Vue tableau : même principe que la vue tableau de Missions — 1 ligne
    // par bénévole, colonnes triables, clic sur la ligne = ouverture directe
    // de la modale fiche bénévole (voir/modifier), comme pour les missions.
    var tableauHtml = "";
    if(role !== "public" && benevolesVue === "tableau"){
      var lignesHtml = listeFiltree.map(function(b){
        var h = Math.round((heuresMap[b.id]||0)*10)/10;
        var missionsRealisees = missionsMap[b.id]||0;
        var tags = (b.poles||[]).map(poleTag).join("");
        var coche = !!benevolesSelection[b.id];
        return '<tr class="mission-row" data-action="open-benevole-modale" data-id="'+b.id+'">'
          + '<td class="col-select"><input type="checkbox" data-action="toggle-select-benevole" data-id="'+b.id+'" '+(coche?"checked":"")+'></td>'
          + '<td>'+escapeHtml(b.nom)
          + (b.actif ? '' : ' <span class="badge-inactif">Inactif</span>') + '</td>'
          + '<td>'+escapeHtml(b.prenom)+'</td>'
          + '<td>'+escapeHtml(b.email||"—")+'</td>'
          + '<td>'+(tags || '—')+'</td>'
          + '<td class="num">'+missionsRealisees+'</td>'
          + '<td class="num">'+h+' h</td>'
          + '</tr>';
      }).join("");

      function thTriBenevole(label, triKey, alignRight){
        var active = benevolesTri === triKey;
        return '<th'+(alignRight?' class="num"':'')+'><button type="button" class="th-tri'+(active?" active":"")+'" data-action="trier-benevoles" data-tri="'+triKey+'">'
          + label + (active ? ' <span class="tri-arrow">▼</span>' : '')
          + '</button></th>';
      }

      var touTochesB = listeFiltree.length > 0 && listeFiltree.every(function(b){ return benevolesSelection[b.id]; });

      tableauHtml = listeFiltree.length ? '<div class="table-scroll"><table class="heures-table"><thead><tr>'
          + '<th class="col-select"><input type="checkbox" data-action="toggle-select-all-benevoles" '+(touTochesB?"checked":"")+'></th>'
          + thTriBenevole("Nom","nom") + thTriBenevole("Prénom","prenom") + '<th>Email</th>' + thTriBenevole("Pôles","poles")
          + thTriBenevole("Missions réalisées","missions",true) + thTriBenevole("Heures données","heures",true)
          + '</tr></thead><tbody>'+lignesHtml+'</tbody></table></div>'
        : '<div class="empty-state">'+(state.benevoles.length ? 'Aucune fiche ne correspond.' : 'Aucun bénévole enregistré pour l\'instant.')+'</div>';
    }

    // Le public n'a plus accès à cet onglet (voir updateTabsVisibility) :
    // l'envoi de candidature se fait désormais depuis l'onglet Missions, pour
    // que le visiteur voie d'abord les missions à pourvoir. Cet onglet ne
    // sert donc plus qu'aux gestionnaires/Directeur pour gérer les fiches
    // bénévoles déjà validées.
    var formHtml = "";
    if(benevoleFormOpen){
      formHtml = '<form class="form" id="form-benevole">'
        + '<div class="field-row">'
        + field("Prénom","prenom",true)
        + field("Nom","nom",true)
        + field("Email","email",true,"email")
        + field("Téléphone","tel",false,"tel")
        + '</div>'
        + '<div class="field"><label>Pôles / domaines</label><div class="checkbox-group">'
        + state.poles.map(function(p){ return '<label class="checkbox-chip"><input type="checkbox" name="pole" value="'+escapeHtml(p)+'"> '+escapeHtml(p)+'</label>'; }).join("")
        + '</div></div>'
        + '<div class="form-actions"><button type="submit" class="btn btn-primary" '+(authReady?"":"disabled")+'>Ajouter le bénévole</button>'
        + '<button type="button" class="btn btn-ghost" data-action="cancel-benevole">Annuler</button>'
        + (authReady ? '' : '<span class="form-hint">Connexion en cours…</span>')
        + (benevoleError ? '<span class="error-text">'+escapeHtml(benevoleError)+'</span>' : '')
        + '</div>'
        + '</form>';
    }

    var vueToggleBtnB = role !== "public"
      ? '<button class="btn btn-badge badge-vue btn-sm" data-action="basculer-vue-benevoles">'+(benevolesVue==="tableau" ? "Vue cartes" : "Vue tableau")+'</button>'
      : '';

    // Boutons Imprimer/Vider : toujours affichés (avec Vue cartes/tableau)
    // pour que la barre d'outils ne saute plus d'une ligne à l'autre — ils
    // sont juste désactivés tant qu'il n'y a rien à imprimer ou à vider
    // (rien coché, ou vue cartes où il n'y a pas de case à cocher). Compte
    // toutes les fiches cochées même si un filtre les cache momentanément.
    var nbSelectionnesB = state.benevoles.filter(function(b){ return benevolesSelection[b.id]; }).length;
    var selectionActiveB = benevolesVue === "tableau" && nbSelectionnesB > 0;
    var imprimerBtnB = role !== "public"
      ? '<button class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-selection-benevoles"'+(selectionActiveB?"":" disabled")+'>Imprimer la sélection ('+nbSelectionnesB+')</button>'
        + '<button class="btn btn-badge badge-imprimer btn-sm" data-action="imprimer-historique-benevoles"'+(selectionActiveB?"":" disabled")+'>Imprimer l\'historique ('+nbSelectionnesB+')</button>'
        + '<button class="btn btn-badge badge-vider btn-sm" data-action="vider-selection-benevoles"'+(selectionActiveB?"":" disabled")+'>Vider la sélection</button>'
      : '';

    // "Actif" (donc cliquable) dès qu'il y a un filtre à retirer OU des
    // cases cochées à vider : le bouton "Supprimer tous les filtres" fait
    // maintenant aussi office de "Vider la sélection" (demande de Jluc).
    var benevolesFiltreActif = !!(benevolesRecherche.trim() || benevolesFiltrePole || benevolesFiltreEtat || nbSelectionnesB > 0);
    var rechercheHtml = '<div style="display:flex;gap:14px;flex-wrap:wrap;">'
      + '<div class="field" style="max-width:420px;margin-bottom:14px;"><label for="benevoles-recherche">Recherche</label>'
      + '<input type="search" id="benevoles-recherche" placeholder="Nom, prénom, email, téléphone ou pôle…" value="'+escapeHtml(benevolesRecherche)+'"></div>'
      + selectFiltrePoleHtml("benevoles-filtre-pole", benevolesFiltrePole)
      + selectFiltreEtatBenevoleHtml("benevoles-filtre-etat", benevolesFiltreEtat)
      + btnSupprimerFiltres("reset-filtres-benevoles", benevolesFiltreActif)
      + '</div>';

    var listeBenevolesHtml = listeFiltree.length ? '<div class="card-grid">'+cards+'</div>'
      : '<div class="empty-state">'+(state.benevoles.length ? 'Aucune fiche ne correspond.' : 'Aucun bénévole enregistré pour l\'instant.')+'</div>';

    document.getElementById("panel-benevoles").innerHTML =
      '<div class="toolbar"><h2>Bénévoles</h2>'
      + '<div style="display:flex;gap:8px;">'+imprimerBtnB+vueToggleBtnB
      + '<button class="btn btn-primary" data-action="open-benevole">+ Ajouter un bénévole</button>'
      + '</div></div>'
      + rechercheHtml
      + formHtml
      + (role !== "public" && benevolesVue === "tableau" ? tableauHtml : listeBenevolesHtml);

    function field(label, name, required, type){
      return '<div class="field"><label for="f-'+name+'">'+label+'</label>'
        + '<input id="f-'+name+'" name="'+name+'" type="'+(type||"text")+'" '+(required ? "required" : "")+'></div>';
    }
  }

  // ---------- render: candidatures (visible gestionnaires + Directeur) ----------
  function renderCandidatures(){
    var liste = state.candidatures.slice().sort(function(a,b){
      var da = a.dateEnvoi && a.dateEnvoi.toMillis ? a.dateEnvoi.toMillis() : 0;
      var db2 = b.dateEnvoi && b.dateEnvoi.toMillis ? b.dateEnvoi.toMillis() : 0;
      return da - db2;
    });

    var cards = liste.map(function(c){
      var tags = (c.poles||[]).map(poleTag).join("");
      // c.email est absent uniquement pour une candidature envoyée avant
      // l'ajout de ce champ au formulaire (voir action "valider-candidature").
      return '<div class="card">'
        + '<div><div class="benevole-name">'+escapeHtml(c.prenom)+' '+escapeHtml(c.nom)+'</div>'
        + '<div class="benevole-contact">'+(c.email ? escapeHtml(c.email) : '<em>Email non renseigné (ancienne candidature)</em>')
          + (c.tel ? '<br>'+escapeHtml(c.tel) : '')+'</div>'
        + (c.dateEnvoi ? '<div class="benevole-contact">Reçue le '+fmtDateTime(c.dateEnvoi)+'</div>' : '')
        + '</div>'
        + '<div class="tags">'+(tags || '<span class="benevole-contact">Aucun pôle renseigné</span>')+'</div>'
        + '<div class="card-footrow"><span></span><span style="display:flex;gap:6px;">'
        + '<button class="btn btn-primary btn-sm" data-action="valider-candidature" data-id="'+c.id+'" '+(authReady?"":"disabled")+'>Valider</button>'
        + '<button class="btn-danger-ghost" data-action="refuser-candidature" data-id="'+c.id+'" title="Refuser">✕</button>'
        + '</span></div>'
        + '</div>';
    }).join("");

    document.getElementById("panel-candidatures").innerHTML =
      '<div class="toolbar"><div><h2>Candidatures</h2><div class="toolbar-meta">'+liste.length+' candidature(s) en attente de validation</div></div></div>'
      + (liste.length ? '<div class="card-grid">'+cards+'</div>' : '<div class="empty-state">Aucune candidature en attente.</div>');
  }

  // ---------- render: missions ----------
  var missionFormOpen = false;
  // Id de la mission en cours de modification (formulaire pré-rempli avec
  // ses valeurs actuelles), ou null quand le formulaire sert à créer une
  // mission. Même formulaire, même bouton "+ Créer une mission" / "Modifier",
  // pour rester le plus simple possible.
  var missionEnEdition = null;
  var missionFormError = "";
  // Vue tableau (gestionnaires/Directeur uniquement) : utile dès que la
  // liste de missions grandit, pour trier/rechercher au lieu de faire
  // défiler des dizaines de cartes. Le public garde uniquement les cartes.
  var missionsVue = "tableau"; // "cartes" | "tableau" — ouverture par défaut sur le tableau pour les Gestionnaires/Directeur (le public voit toujours les cartes)
  var missionsRecherche = "";
  var missionsTri = "date"; // "date"(plus proche d'abord) | "titre" | "pole" | "statut" | "lieu" | "places" | "inscrits"
  var missionsFiltrePole = "";
  var missionsFiltreStatut = "";
  var missionsFiltreDispo = ""; // "" | "incomplete" | "complete"
  var missionsSelection = {}; // { [missionId]: true } — cases cochées pour l'impression

  // Même principe que resetFiltresBenevoles() : remet à zéro recherche,
  // filtres et sélection de l'onglet Missions (mais pas le tri).
  function resetFiltresMissions(){
    missionsRecherche = ""; missionsFiltrePole = ""; missionsFiltreStatut = ""; missionsFiltreDispo = "";
    missionsSelection = {};
  }

  // Bloc "qui est inscrit + inscrire quelqu'un", commun à la carte de
  // mission en lecture (missionCardHtml) ET à la modale de création/
  // modification (missionFormModalHtml), pour ne jamais avoir deux fois la
  // même logique à maintenir.
  function missionInscritsSectionHtml(m){
    var restantes = placesRestantes(m);
    var inscrits = inscritsDe(m.id);

    var inscritsHtml = inscrits.map(function(a){
      var b = benevoleById(a.benevoleId);
      if(!b) return "";
      var actionsHtml = "";
      if(role !== "public"){
        actionsHtml += '<label class="realise-toggle"><input type="checkbox" data-action="toggle-realise" data-id="'+a.id+'" '+(a.statut==="realise"?"checked":"")+'> réalisé</label>';
      } else if(a.statut === "realise"){
        actionsHtml += '<span class="realise-toggle">✓ réalisé</span>';
      }
      if(role !== "public"){
        actionsHtml += '<button class="btn-danger-ghost" data-action="retirer" data-id="'+a.id+'" title="Retirer l\'inscription">✕</button>';
      }
      return '<div class="inscrit-row"><div class="inscrit-name"><span class="avatar">'+initiales(b)+'</span>'
        + escapeHtml(b.prenom)+' '+escapeHtml(b.nom)+'</div>'
        + '<div class="inscrit-actions">'+actionsHtml+'</div></div>';
    }).join("");

    var disponibles = state.benevoles.filter(function(b){
      return b.actif && !inscrits.some(function(a){ return a.benevoleId === b.id; });
    }).sort(function(a,b){
      return (a.nom||"").localeCompare(b.nom||"", "fr", {sensitivity:"base"})
        || (a.prenom||"").localeCompare(b.prenom||"", "fr", {sensitivity:"base"});
    });

    var selectHtml;
    if(restantes<=0){
      selectHtml = '';
    } else if(role !== "public"){
      // Gestionnaire/Directeur : peut inscrire n'importe quel bénévole
      // (utile quand quelqu'un s'inscrit par téléphone, par exemple).
      selectHtml = disponibles.length
        ? '<div class="inscrire-row"><select id="sel-'+m.id+'">'
          + disponibles.map(function(b){ return '<option value="'+b.id+'">'+escapeHtml(b.prenom)+' '+escapeHtml(b.nom)+'</option>'; }).join("")
          + '</select><button class="btn btn-sm" data-action="inscrire" data-mission="'+m.id+'" '+(authReady?"":"disabled")+'>Inscrire</button></div>'
        : '<div class="benevole-contact">Tous les bénévoles actifs sont déjà inscrits.</div>';
    } else {
      // Visiteur public : ne peut s'inscrire que lui-même, une fois identifié.
      var moi = moiBenevoleId ? benevoleById(moiBenevoleId) : null;
      var moiDejaInscrit = moi && inscrits.some(function(a){ return a.benevoleId === moi.id; });
      if(!moi){
        selectHtml = '<div class="benevole-contact">Indiquez qui vous êtes en haut de la page pour vous inscrire.</div>';
      } else if(moiDejaInscrit){
        selectHtml = '';
      } else {
        selectHtml = '<div class="inscrire-row"><button class="btn btn-sm btn-primary" data-action="inscrire-moi" data-mission="'+m.id+'" '+(authReady?"":"disabled")+'>M\'inscrire ('+escapeHtml(moi.prenom)+')</button></div>';
      }
    }

    return '<div class="inscrits-list">'+(inscritsHtml || '<div class="benevole-contact">Personne d\'inscrit pour le moment.</div>')+'</div>'
      + selectHtml;
  }

  // Construit la carte détaillée d'une mission (titre, inscrits, actions).
  // Réutilisée telle quelle dans la vue cartes ET repliée dans une ligne du
  // tableau récapitulatif (vue tableau), pour ne pas dupliquer la logique.
  function missionCardHtml(m){
    var restantes = placesRestantes(m);
    var badgeCls = "places-badge" + (restantes <= 0 ? " low" : "");
    var badgeTxt = restantes <= 0 ? "Complet" : (restantes + " place" + (restantes>1?"s":"") + " restante" + (restantes>1?"s":""));
    var inscrits = inscritsDe(m.id);
    var moiEstInscrit = role === "public" && moiBenevoleId && inscrits.some(function(a){ return a.benevoleId === moiBenevoleId; });

    return '<div class="card">'
      + '<div class="mission-head"><div><div class="mission-title">'+escapeHtml(libelleMission(m))+'</div>'
      + '<div class="mission-when">'+fmtDate(m.date)+' · '+m.debut+'–'+m.fin+' · '+escapeHtml(m.lieu)+'</div></div>'
      + '<span class="'+badgeCls+'">'+badgeTxt+'</span></div>'
      + (role !== "public" && statutMission(m) === "À vérifier"
          ? '<div class="mission-a-pointer">⚠ Statut « À vérifier » : pensez à cocher qui est venu ci-dessous.</div>'
          : '')
      + '<div class="tags">'+poleTag(m.pole)
      + (role !== "public" ? statutTag(statutMission(m)) : '')
      + (moiEstInscrit ? '<span class="tag" style="background:var(--success-soft);color:var(--success-soft-ink);">✓ Vous êtes inscrit·e</span>' : '')
      + '</div>'
      + '<div class="mission-desc">'+escapeHtml(m.description)+'</div>'
      // Commentaires : note interne pour les gestionnaires/Directeur (suivi,
      // consignes, points de vigilance...), jamais montrée au public — à la
      // différence de la description, qui est publique.
      + (role !== "public" && m.commentaires ? '<div class="mission-commentaires"><strong>Commentaires : </strong>'+escapeHtml(m.commentaires)+'</div>' : '')
      + (m.creePar ? '<div class="mission-meta">Proposée par '+escapeHtml(m.creePar)+'</div>' : '')
      + missionInscritsSectionHtml(m)
      + (role !== "public" ? '<div style="display:flex;gap:6px;">'
          + '<button class="btn btn-ghost btn-sm" data-action="edit-mission" data-id="'+m.id+'">Modifier</button>'
          + (role === "directeur" ? '<button class="btn-danger-ghost" data-action="delete-mission" data-id="'+m.id+'">Supprimer la mission</button>' : '')
          + '</div>' : '')
      + '</div>';
  }

  function renderMissions(){
    // Le public voit les missions où il reste de la place (pas d'intérêt à
    // afficher une mission complète à quelqu'un qui ne peut pas s'y inscrire),
    // PLUS les missions où le visiteur identifié est déjà inscrit — même
    // complètes — pour qu'il retrouve toujours ses propres missions.
    // Sauf si l'heure de fin est dépassée (demande de Jluc) : une mission
    // passée n'est plus proposée sur la page de garde, même si le visiteur
    // y était inscrit — elle disparaît systématiquement dès que finie.
    // Gestionnaires et Directeur voient tout, y compris les missions
    // passées et déjà complètes, pour pouvoir suivre et gérer (retirer
    // quelqu'un, marquer les heures faites…).
    var missionsAffichees = role === "public"
      ? state.missions.filter(function(m){
          if(missionEstPassee(m)) return false;
          if(placesRestantes(m) > 0) return true;
          return moiBenevoleId && inscritsDe(m.id).some(function(a){ return a.benevoleId === moiBenevoleId; });
        })
      : state.missions;

    var cards = missionsAffichees.map(missionCardHtml).join("");

    // Vue tableau (gestionnaires/Directeur) : recherche + tri, une ligne par
    // mission, pour rester lisible même avec beaucoup de missions.
    var tableauHtml = "";
    if(role !== "public" && missionsVue === "tableau"){
      var rechercheM = missionsRecherche.trim().toLowerCase();
      var lignes = missionsAffichees.filter(function(m){
        if(missionsFiltrePole && m.pole !== missionsFiltrePole) return false;
        if(missionsFiltreStatut && statutMission(m) !== missionsFiltreStatut) return false;
        if(missionsFiltreDispo === "incomplete" && placesRestantes(m) <= 0) return false;
        if(missionsFiltreDispo === "complete" && placesRestantes(m) > 0) return false;
        if(!rechercheM) return true;
        return (m.titre||"").toLowerCase().indexOf(rechercheM) >= 0
          || (m.pole||"").toLowerCase().indexOf(rechercheM) >= 0
          || statutMission(m).toLowerCase().indexOf(rechercheM) >= 0
          || (m.lieu||"").toLowerCase().indexOf(rechercheM) >= 0
          || (m.description||"").toLowerCase().indexOf(rechercheM) >= 0
          || (m.commentaires||"").toLowerCase().indexOf(rechercheM) >= 0
          || (m.creePar||"").toLowerCase().indexOf(rechercheM) >= 0;
      });

      lignes.sort(function(a,b){
        if(missionsTri === "titre"){
          var cmpT = (a.titre||"").localeCompare(b.titre||"", "fr", {sensitivity:"base"});
          if(cmpT !== 0) return cmpT;
        } else if(missionsTri === "pole"){
          var cmpP = (a.pole||"").localeCompare(b.pole||"", "fr", {sensitivity:"base"});
          if(cmpP !== 0) return cmpP;
        } else if(missionsTri === "statut"){
          var cmpS = statutMission(a).localeCompare(statutMission(b), "fr", {sensitivity:"base"});
          if(cmpS !== 0) return cmpS;
        } else if(missionsTri === "lieu"){
          var cmpL = (a.lieu||"").localeCompare(b.lieu||"", "fr", {sensitivity:"base"});
          if(cmpL !== 0) return cmpL;
        } else if(missionsTri === "places"){
          // Les moins de places restantes d'abord : ce sont celles qui ont
          // le plus besoin de bénévoles en urgence.
          var cmpPl = placesRestantes(a) - placesRestantes(b);
          if(cmpPl !== 0) return cmpPl;
        } else if(missionsTri === "inscrits"){
          var cmpI = inscritsDe(b.id).length - inscritsDe(a.id).length;
          if(cmpI !== 0) return cmpI;
        }
        // Par défaut (Date), et à égalité sur les autres tris : la mission
        // la plus proche dans le temps d'abord.
        var da = (a.date||"") + " " + (a.debut||"");
        var db = (b.date||"") + " " + (b.debut||"");
        if(da !== db) return da < db ? -1 : 1;
        return (a.titre||"").localeCompare(b.titre||"", "fr", {sensitivity:"base"});
      });

      var lignesHtml = lignes.map(function(m){
        var inscritsLigne = inscritsDe(m.id);
        var nomsInscrits = inscritsLigne.map(function(a){
          var b = benevoleById(a.benevoleId);
          return b ? escapeHtml(b.prenom)+' '+escapeHtml(b.nom) : "";
        }).filter(Boolean).join(", ");
        var coche = !!missionsSelection[m.id];
        // Clic sur la ligne = ouvre directement la modale de gestion de la
        // mission (demande de Jluc) : plus de dépliage sur place, tout se
        // passe dans la même modale que celle ouverte depuis une fiche
        // bénévole (voir missionFormModalHtml). Seule la case à cocher a
        // sa propre action et n'ouvre pas la modale (elle est retrouvée en
        // priorité par la délégation de clic, voir data-action plus haut).
        var coloreStatut = STATUT_COULEUR[statutMission(m)] || "accent";
        return '<tr class="mission-row statut-'+coloreStatut+'" data-action="edit-mission" data-id="'+m.id+'">'
          + '<td class="col-select"><input type="checkbox" data-action="toggle-select-mission" data-id="'+m.id+'" '+(coche?"checked":"")+'></td>'
          + '<td><strong>'+fmtDateCourt(m.date)+'</strong>'
          + '<div class="mission-date-detail">'+fmtDate(m.date)+' · '+m.debut+'–'+m.fin+'</div>'
          + (m.creeLe ? '<div class="mission-creele">Mission créée le '+fmtDateTime(m.creeLe)+'</div>' : '')
          + '</td>'
          + '<td>'+escapeHtml(libelleMission(m))
          + '<div class="mission-date-detail">'+escapeHtml(m.lieu)+'</div></td>'
          + '<td>'+placesBadgeHtml(m)+'</td>'
          + '<td>'+(nomsInscrits || '<span class="benevole-contact">Personne d\'inscrit</span>')+'</td>'
          + '<td>'+poleTag(m.pole)+'</td>'
          + '<td>'+statutTag(statutMission(m))+'</td>'
          + '</tr>';
      }).join("");

      function thTriMission(label, triKey, alignRight){
        var active = missionsTri === triKey;
        return '<th'+(alignRight?' class="num"':'')+'><button type="button" class="th-tri'+(active?" active":"")+'" data-action="trier-missions" data-tri="'+triKey+'">'
          + label + (active ? ' <span class="tri-arrow">▼</span>' : '')
          + '</button></th>';
      }

      var touTochesM = lignes.length > 0 && lignes.every(function(m){ return missionsSelection[m.id]; });

      // "Actif" (donc cliquable) dès qu'il y a un filtre à retirer OU des
      // cases cochées à vider : le bouton "Supprimer tous les filtres" fait
      // maintenant aussi office de "Vider la sélection" (demande de Jluc).
      var nbSelectionnesMissionsFiltre = state.missions.filter(function(m){ return missionsSelection[m.id]; }).length;
      var missionsFiltreActif = !!(missionsRecherche.trim() || missionsFiltrePole || missionsFiltreStatut || missionsFiltreDispo || nbSelectionnesMissionsFiltre > 0);
      tableauHtml = '<div style="display:flex;gap:14px;flex-wrap:wrap;">'
        + '<div class="field" style="max-width:420px;margin-bottom:14px;"><label for="missions-recherche">Recherche</label>'
        + '<input type="search" id="missions-recherche" placeholder="Titre, pôle, lieu, description…" value="'+escapeHtml(missionsRecherche)+'"></div>'
        + selectFiltrePoleHtml("missions-filtre-pole", missionsFiltrePole)
        + selectFiltreStatutHtml("missions-filtre-statut", missionsFiltreStatut)
        + selectFiltreDispoMissionHtml("missions-filtre-dispo", missionsFiltreDispo)
        + btnSupprimerFiltres("reset-filtres-missions", missionsFiltreActif)
        + '</div>'
        + (lignes.length ? '<div class="table-scroll"><table class="heures-table missions-table"><thead><tr>'
            + '<th class="col-select"><input type="checkbox" data-action="toggle-select-all-missions" '+(touTochesM?"checked":"")+'></th>'
            + thTriMission("Date","date") + thTriMission("Titre","titre")
            + thTriMission("Places","places") + thTriMission("Inscrits","inscrits")
            + thTriMission("Pôle","pole") + thTriMission("Statut","statut")
